<!-- Tabla de Productos/Inventario -->
<div class="table-container">
    <div class="table-header">
        <h3>Control de Inventario</h3>
        <div class="table-actions">
            <button class="btn btn-primary" id="btn-novo-produto">
                <i class="fas fa-plus"></i> Nuevo Producto
            </button>
            <button class="btn btn-warning" id="btn-movimentar-estoque">
                <i class="fas fa-exchange-alt"></i> Movimentar
            </button>
            <button class="btn btn-secondary" id="btn-exportar-produtos">
                <i class="fas fa-download"></i> Exportar
            </button>
        </div>
    </div>
    
    <div class="table-filters">
        <div class="filter-group">
            <input type="text" placeholder="Buscar producto..." id="search-produto" class="search-input">
            <select id="filter-categoria" class="filter-select">
                <option value="">Todas las Categorías</option>
                <option value="pecas">Repuestos</option>
                <option value="oleos">Aceites y Lubricantes</option>
                <option value="filtros">Filtros</option>
                <option value="pneus">Cubiertas</option>
                <option value="acessorios">Accesorios</option>
            </select>
            <select id="filter-estoque" class="filter-select">
                <option value="">Todos los Inventarios</option>
                <option value="baixo">Stock Bajo</option>
                <option value="zerado">Stock Agotado</option>
                <option value="normal">Stock Normal</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="data-table" id="produtos-table">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Marca</th>
                    <th>Stock Actual</th>
                    <th>Stock Mínimo</th>
                    <th>Precio Costo</th>
                    <th>Precio Venta</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Datos se cargarán via JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="table-pagination">
        <div class="pagination-info">
            <span>Mostrando <span id="showing-start">1</span> a <span id="showing-end">10</span> de <span id="total-records">0</span> registros</span>
        </div>
        <div class="pagination-controls">
            <button class="btn-pagination" id="btn-prev" disabled>
                <i class="fas fa-chevron-left"></i>
            </button>
            <span class="pagination-numbers" id="pagination-numbers">
                <!-- Números de páginas se generarán via JavaScript -->
            </span>
            <button class="btn-pagination" id="btn-next">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>
