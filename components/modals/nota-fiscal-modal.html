<!-- Modal de Nota Fiscal -->
<div id="nota-fiscal-modal" class="modal">
    <div class="modal-content modal-xl">
        <div class="modal-header">
            <h3 class="modal-title" id="nota-fiscal-modal-title">Nova Nota Fiscal</h3>
            <button type="button" class="modal-close" onclick="fecharModalNotaFiscal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="nota-fiscal-form" method="post" action="" onsubmit="return salvarNotaFiscal(event)">
                <input type="hidden" id="nota-fiscal-id" name="id">
                
                <!-- Informações da Empresa -->
                <div class="form-section">
                    <h4><i class="fas fa-building"></i> Dados da Empresa (Emitente)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empresa-razao-social">Razão Social *</label>
                            <input type="text" id="empresa-razao-social" name="empresa_razao_social" class="form-control" required value="Oficina Mecânica LTDA">
                        </div>
                        <div class="form-group">
                            <label for="empresa-cnpj" class="required">CNPJ</label>
                            <input type="text" id="empresa-cnpj" name="empresa_cnpj" class="form-control" required value="12.345.678/0001-90" data-mask="cnpj" data-validate="cnpj">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empresa-endereco">Endereço *</label>
                            <input type="text" id="empresa-endereco" name="empresa_endereco" class="form-control" required value="Rua das Oficinas, 123">
                        </div>
                        <div class="form-group">
                            <label for="empresa-cidade">Cidade *</label>
                            <input type="text" id="empresa-cidade" name="empresa_cidade" class="form-control" required value="São Paulo">
                        </div>
                        <div class="form-group">
                            <label for="empresa-uf">UF *</label>
                            <select id="empresa-uf" name="empresa_uf" class="form-control" required>
                                <option value="SP" selected>SP</option>
                                <option value="RJ">RJ</option>
                                <option value="MG">MG</option>
                                <option value="RS">RS</option>
                                <option value="PR">PR</option>
                                <option value="SC">SC</option>
                                <!-- Adicionar outros estados conforme necessário -->
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Informações do Cliente -->
                <div class="form-section">
                    <h4><i class="fas fa-user"></i> Dados do Cliente (Destinatário)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-select">Cliente *</label>
                            <select id="cliente-select" name="cliente_id" class="form-control" required onchange="carregarDadosCliente()">
                                <option value="">Selecione um cliente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cliente-tipo-documento">Tipo de Documento</label>
                            <select id="cliente-tipo-documento" name="cliente_tipo_documento" class="form-control">
                                <option value="cpf">CPF</option>
                                <option value="cnpj">CNPJ</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-nome">Nome/Razão Social *</label>
                            <input type="text" id="cliente-nome" name="cliente_nome" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="cliente-documento">CPF/CNPJ *</label>
                            <input type="text" id="cliente-documento" name="cliente_documento" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-endereco">Endereço</label>
                            <input type="text" id="cliente-endereco" name="cliente_endereco" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="cliente-cidade">Cidade</label>
                            <input type="text" id="cliente-cidade" name="cliente_cidade" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Informações da Nota Fiscal -->
                <div class="form-section">
                    <h4><i class="fas fa-file-invoice"></i> Dados da Nota Fiscal</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nf-numero">Número da NF *</label>
                            <input type="text" id="nf-numero" name="numero" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="nf-serie">Série *</label>
                            <input type="text" id="nf-serie" name="serie" class="form-control" required value="1">
                        </div>
                        <div class="form-group">
                            <label for="nf-data-emissao">Data de Emissão *</label>
                            <input type="datetime-local" id="nf-data-emissao" name="data_emissao" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nf-natureza-operacao">Natureza da Operação *</label>
                            <select id="nf-natureza-operacao" name="natureza_operacao" class="form-control" required>
                                <option value="">Selecione</option>
                                <option value="venda">Venda de Mercadoria</option>
                                <option value="prestacao_servico">Prestação de Serviço</option>
                                <option value="venda_servico">Venda de Mercadoria e Prestação de Serviço</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="nf-tipo-documento">Tipo de Documento *</label>
                            <select id="nf-tipo-documento" name="tipo_documento" class="form-control" required>
                                <option value="55">55 - NFe</option>
                                <option value="65">65 - NFCe</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Itens da Nota Fiscal -->
                <div class="form-section">
                    <h4><i class="fas fa-list"></i> Itens da Nota Fiscal</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="item-tipo">Tipo de Item</label>
                            <select id="item-tipo" class="form-control">
                                <option value="">Selecione o tipo</option>
                                <option value="produto">Produto</option>
                                <option value="servico">Serviço</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="item-codigo">Item</label>
                            <select id="item-codigo" class="form-control">
                                <option value="">Selecione um item</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="item-quantidade-nf">Quantidade</label>
                            <input type="number" id="item-quantidade-nf" class="form-control" min="1" step="0.01" value="1">
                        </div>
                        <div class="form-group">
                            <button type="button" class="btn btn-success" id="btn-adicionar-item">
                                <i class="fas fa-plus"></i> Adicionar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabela de Itens -->
                <div class="form-section">
                    <div class="table-responsive">
                        <table class="table" id="itens-nf-table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Descrição</th>
                                    <th>NCM</th>
                                    <th>CFOP</th>
                                    <th>Unidade</th>
                                    <th>Qtd</th>
                                    <th>Valor Unit.</th>
                                    <th>Total</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="itens-nf-body">
                                <tr class="empty-state">
                                    <td colspan="9" class="text-center">Nenhum item adicionado</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Totais da Nota Fiscal -->
                <div class="form-section">
                    <div class="nf-totals-container">
                        <div class="totals-grid">
                            <div class="total-item">
                                <label>Base de Cálculo ICMS:</label>
                                <span id="nf-base-icms">R$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor ICMS:</label>
                                <span id="nf-valor-icms">R$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Base de Cálculo ICMS ST:</label>
                                <span id="nf-base-icms-st">R$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor ICMS ST:</label>
                                <span id="nf-valor-icms-st">R$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor Total dos Produtos:</label>
                                <span id="nf-total-produtos">R$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor do Frete:</label>
                                <input type="number" id="nf-frete" name="valor_frete" class="form-control" step="0.01" value="0" onchange="calcularTotaisNF()">
                            </div>
                            <div class="total-item">
                                <label>Valor do Seguro:</label>
                                <input type="number" id="nf-seguro" name="valor_seguro" class="form-control" step="0.01" value="0" onchange="calcularTotaisNF()">
                            </div>
                            <div class="total-item">
                                <label>Outras Despesas:</label>
                                <input type="number" id="nf-outras-despesas" name="outras_despesas" class="form-control" step="0.01" value="0" onchange="calcularTotaisNF()">
                            </div>
                            <div class="total-item total-final">
                                <label>Valor Total da NF:</label>
                                <span id="nf-total-geral">R$ 0,00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Informações Adicionais -->
                <div class="form-section">
                    <h4><i class="fas fa-info-circle"></i> Informações Adicionais</h4>
                    <div class="form-group">
                        <label for="nf-observacoes">Observações</label>
                        <textarea id="nf-observacoes" name="observacoes" class="form-control" rows="3" placeholder="Informações complementares da nota fiscal..."></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="fecharModalNotaFiscal()">
                <i class="fas fa-times"></i> Cancelar
            </button>
            <button type="button" class="btn btn-warning" onclick="visualizarNotaFiscal()">
                <i class="fas fa-eye"></i> Visualizar
            </button>
            <button type="submit" form="nota-fiscal-form" class="btn btn-primary">
                <i class="fas fa-save"></i> Emitir Nota Fiscal
            </button>
        </div>
    </div>
</div>

<script>
let itensNotaFiscal = [];
let numeroNotaFiscal = 1;

function abrirModalNotaFiscal(id = null) {
    const modal = document.getElementById('nota-fiscal-modal');
    const title = document.getElementById('nota-fiscal-modal-title');
    
    if (!modal) {
        console.error('Modal de nota fiscal não encontrado');
        return;
    }
    
    if (title) {
        if (id) {
            title.textContent = 'Editar Nota Fiscal';
            carregarDadosNotaFiscal(id);
        } else {
            title.textContent = 'Nova Nota Fiscal';
            const form = document.getElementById('nota-fiscal-form');
            if (form) {
                form.reset();
            }
            itensNotaFiscal = [];
            gerarNumeroNotaFiscal();
            definirDataEmissaoAtual();
            atualizarTabelaItensNF();
            calcularTotaisNF();
        }
    }
    
    carregarClientesNF();
    modal.style.display = 'block';
    modal.classList.add('show');
}

function fecharModalNotaFiscal() {
    const modal = document.getElementById('nota-fiscal-modal');
    if (modal) {
        modal.style.display = 'none';
        modal.classList.remove('show');
    }
    
    const form = document.getElementById('nota-fiscal-form');
    if (form) {
        form.reset();
    }
    
    itensNotaFiscal = [];
    
    // Limpar tabela de itens
    const tbody = document.getElementById('itens-nf-body');
    if (tbody) {
        tbody.innerHTML = '<tr class="empty-state"><td colspan="9" class="text-center">Nenhum item adicionado</td></tr>';
    }
    
    // Resetar totais
    calcularTotaisNF();
}

function gerarNumeroNotaFiscal() {
    // Simular geração de número sequencial
    const numeroAtual = localStorage.getItem('ultimoNumeroNF') || '0';
    numeroNotaFiscal = parseInt(numeroAtual) + 1;
    const numeroInput = document.getElementById('nf-numero');
    if (numeroInput) {
        numeroInput.value = numeroNotaFiscal.toString().padStart(9, '0');
    }
}

function definirDataEmissaoAtual() {
    const agora = new Date();
    const dataFormatada = agora.toISOString().slice(0, 16);
    const dataInput = document.getElementById('nf-data-emissao');
    if (dataInput) {
        dataInput.value = dataFormatada;
    }
}

function carregarClientesNF() {
    const select = document.getElementById('cliente-select');
    select.innerHTML = '<option value="">Selecione um cliente</option>';
    
    // Simular carregamento de clientes
    const clientesMock = [
        { 
            id: 1, 
            nome: 'João Silva', 
            cpf: '123.456.789-00',
            endereco: 'Rua A, 123',
            cidade: 'São Paulo'
        },
        { 
            id: 2, 
            nome: 'Maria Santos LTDA', 
            cnpj: '12.345.678/0001-90',
            endereco: 'Av. B, 456',
            cidade: 'Rio de Janeiro'
        }
    ];
    
    clientesMock.forEach(cliente => {
        const option = document.createElement('option');
        option.value = JSON.stringify(cliente);
        option.textContent = cliente.nome;
        select.appendChild(option);
    });
}

function carregarDadosCliente() {
    const clienteSelect = document.getElementById('cliente-select');
    if (!clienteSelect.value) return;
    
    const cliente = JSON.parse(clienteSelect.value);
    
    document.getElementById('cliente-nome').value = cliente.nome;
    document.getElementById('cliente-endereco').value = cliente.endereco || '';
    document.getElementById('cliente-cidade').value = cliente.cidade || '';
    
    if (cliente.cpf) {
        document.getElementById('cliente-tipo-documento').value = 'cpf';
        document.getElementById('cliente-documento').value = cliente.cpf;
    } else if (cliente.cnpj) {
        document.getElementById('cliente-tipo-documento').value = 'cnpj';
        document.getElementById('cliente-documento').value = cliente.cnpj;
    }
}

function carregarItensNF() {
    const tipo = document.getElementById('item-tipo').value;
    const select = document.getElementById('item-codigo');
    select.innerHTML = '<option value="">Selecione um item</option>';
    
    if (!tipo) return;
    
    let itensMock = [];
    
    if (tipo === 'produto') {
        itensMock = [
            { 
                id: 1, 
                codigo: 'PROD001',
                nome: 'Óleo Motor 5W30', 
                preco: 35.00,
                ncm: '27101932',
                cfop: '5102',
                unidade: 'LT'
            },
            { 
                id: 2, 
                codigo: 'PROD002',
                nome: 'Filtro de Ar', 
                preco: 25.00,
                ncm: '84213100',
                cfop: '5102',
                unidade: 'UN'
            }
        ];
    } else if (tipo === 'servico') {
        itensMock = [
            { 
                id: 1, 
                codigo: 'SERV001',
                nome: 'Troca de Óleo', 
                preco: 50.00,
                ncm: '00000000',
                cfop: '5933',
                unidade: 'UN'
            },
            { 
                id: 2, 
                codigo: 'SERV002',
                nome: 'Alinhamento', 
                preco: 80.00,
                ncm: '00000000',
                cfop: '5933',
                unidade: 'UN'
            }
        ];
    }
    
    itensMock.forEach(item => {
        const option = document.createElement('option');
        option.value = JSON.stringify(item);
        option.textContent = `${item.codigo} - ${item.nome}`;
        select.appendChild(option);
    });
}

function adicionarItemNF() {
    const itemSelect = document.getElementById('item-codigo');
    const quantidadeInput = document.getElementById('item-quantidade-nf');
    
    if (!itemSelect.value || !quantidadeInput.value) {
        alert('Por favor, selecione um item e informe a quantidade.');
        return;
    }
    
    const item = JSON.parse(itemSelect.value);
    const quantidade = parseFloat(quantidadeInput.value);
    
    const itemNF = {
        id: Date.now(),
        codigo: item.codigo,
        descricao: item.nome,
        ncm: item.ncm,
        cfop: item.cfop,
        unidade: item.unidade,
        quantidade: quantidade,
        valor_unitario: item.preco,
        valor_total: item.preco * quantidade
    };
    
    itensNotaFiscal.push(itemNF);
    atualizarTabelaItensNF();
    calcularTotaisNF();
    
    // Limpar campos
    document.getElementById('item-tipo').value = '';
    document.getElementById('item-codigo').innerHTML = '<option value="">Selecione um item</option>';
    document.getElementById('item-quantidade-nf').value = 1;
}

function removerItemNF(id) {
    itensNotaFiscal = itensNotaFiscal.filter(item => item.id !== id);
    atualizarTabelaItensNF();
    calcularTotaisNF();
}

function atualizarTabelaItensNF() {
    const tbody = document.getElementById('itens-nf-body');
    
    if (!tbody) {
        console.error('Tabela de itens não encontrada');
        return;
    }
    
    if (itensNotaFiscal.length === 0) {
        tbody.innerHTML = '<tr class="empty-state"><td colspan="9" class="text-center">Nenhum item adicionado</td></tr>';
        return;
    }
    
    tbody.innerHTML = itensNotaFiscal.map(item => `
        <tr>
            <td>${item.codigo}</td>
            <td>${item.descricao}</td>
            <td>${item.ncm}</td>
            <td>${item.cfop}</td>
            <td>${item.unidade}</td>
            <td>${item.quantidade}</td>
            <td>R$ ${item.valor_unitario.toFixed(2)}</td>
            <td>R$ ${item.valor_total.toFixed(2)}</td>
            <td>
                <button type="button" class="btn btn-sm btn-danger" onclick="removerItemNF(${item.id})">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

function calcularTotaisNF() {
    const totalProdutos = itensNotaFiscal.reduce((total, item) => total + item.valor_total, 0);
    
    const freteInput = document.getElementById('nf-frete');
    const seguroInput = document.getElementById('nf-seguro');
    const outrasInput = document.getElementById('nf-outras-despesas');
    
    const frete = freteInput ? (parseFloat(freteInput.value) || 0) : 0;
    const seguro = seguroInput ? (parseFloat(seguroInput.value) || 0) : 0;
    const outrasDespesas = outrasInput ? (parseFloat(outrasInput.value) || 0) : 0;
    
    const totalGeral = totalProdutos + frete + seguro + outrasDespesas;
    
    // Cálculo simplificado de impostos (18% de ICMS)
    const baseICMS = totalProdutos;
    const valorICMS = baseICMS * 0.18;
    
    // Atualizar elementos com verificação de existência
    const totalProdutosEl = document.getElementById('nf-total-produtos');
    if (totalProdutosEl) totalProdutosEl.textContent = `R$ ${totalProdutos.toFixed(2)}`;
    
    const baseICMSEl = document.getElementById('nf-base-icms');
    if (baseICMSEl) baseICMSEl.textContent = `R$ ${baseICMS.toFixed(2)}`;
    
    const valorICMSEl = document.getElementById('nf-valor-icms');
    if (valorICMSEl) valorICMSEl.textContent = `R$ ${valorICMS.toFixed(2)}`;
    
    const baseICMSSTEl = document.getElementById('nf-base-icms-st');
    if (baseICMSSTEl) baseICMSSTEl.textContent = 'R$ 0,00';
    
    const valorICMSSTEl = document.getElementById('nf-valor-icms-st');
    if (valorICMSSTEl) valorICMSSTEl.textContent = 'R$ 0,00';
    
    const totalGeralEl = document.getElementById('nf-total-geral');
    if (totalGeralEl) totalGeralEl.textContent = `R$ ${totalGeral.toFixed(2)}`;
}

function visualizarNotaFiscal() {
    if (itensNotaFiscal.length === 0) {
        alert('Adicione pelo menos um item à nota fiscal.');
        return;
    }
    
    // Implementar visualização da nota fiscal
    alert('Funcionalidade de visualização será implementada em breve.');
}

function salvarNotaFiscal(event) {
    event.preventDefault();
    
    if (itensNotaFiscal.length === 0) {
        alert('Adicione pelo menos um item à nota fiscal.');
        return false;
    }
    
    const formData = new FormData(event.target);
    const notaFiscal = Object.fromEntries(formData.entries());
    
    notaFiscal.itens = itensNotaFiscal;
    notaFiscal.total_produtos = itensNotaFiscal.reduce((total, item) => total + item.valor_total, 0);
    notaFiscal.total_geral = notaFiscal.total_produtos + 
                            (parseFloat(notaFiscal.valor_frete) || 0) + 
                            (parseFloat(notaFiscal.valor_seguro) || 0) + 
                            (parseFloat(notaFiscal.outras_despesas) || 0);
    
    console.log('Emitindo nota fiscal:', notaFiscal);
    
    // Salvar no localStorage
    const notasFiscais = JSON.parse(localStorage.getItem('notasFiscais') || '[]');
    notasFiscais.push(notaFiscal);
    localStorage.setItem('notasFiscais', JSON.stringify(notasFiscais));
    
    // Salvar último número usado
    localStorage.setItem('ultimoNumeroNF', numeroNotaFiscal.toString());
    
    // Aqui você implementaria a chamada para a API da SEFAZ
    fecharModalNotaFiscal();
    
    // Recarregar a tabela de notas fiscais
    if (typeof carregarNotasFiscais === 'function') {
        carregarNotasFiscais();
    }
    
    alert('Nota fiscal emitida com sucesso!');
    return false;
}

// Fechar modal ao clicar fora dele
document.addEventListener('click', function(event) {
    const modal = document.getElementById('nota-fiscal-modal');
    if (modal && event.target === modal) {
        fecharModalNotaFiscal();
    }
});

// Fechar modal com tecla ESC
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        const modal = document.getElementById('nota-fiscal-modal');
        if (modal && modal.style.display === 'block') {
            fecharModalNotaFiscal();
        }
    }
});
</script>

<style>
.modal-xl {
    max-width: 1200px;
}

.nf-totals-container {
    background: #f8f9fa;
    padding: 1.5rem;
    border-radius: 8px;
    border: 1px solid #dee2e6;
}

.totals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1rem;
}

.total-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem;
    background: white;
    border-radius: 4px;
    border: 1px solid #e9ecef;
}

.total-item label {
    font-weight: 500;
    margin: 0;
}

.total-item input {
    width: 100px;
    text-align: right;
}

.total-final {
