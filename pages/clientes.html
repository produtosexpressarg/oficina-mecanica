<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestão de Clientes - Sistema de Gestão para Oficina Mecânica">
    <title>Clientes - Sistema de Gestão Oficina</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../assets/css/design-system.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Page Specific Styles -->
    <style>
        /* Client Management Specific Styles */
        .client-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .client-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }
        
        .stat-card {
            background: var(--color-bg-card);
            padding: var(--spacing-md);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-sm);
            text-align: center;
            border-left: 4px solid var(--color-primary);
        }
        
        .stat-number {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-bold);
            color: var(--color-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .stat-label {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
        }
        
        .search-filters {
            background: var(--color-bg-card);
            padding: var(--spacing-lg);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-lg);
        }
        
        .filter-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: var(--spacing-md);
            align-items: end;
        }
        
        .clients-table-container {
            background: var(--color-bg-card);
            border-radius: var(--border-radius-md);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        
        .table-header {
            background: var(--color-primary);
            color: white;
            padding: var(--spacing-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .clients-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .clients-table th,
        .clients-table td {
            padding: var(--spacing-md);
            text-align: left;
            border-bottom: 1px solid var(--color-border);
        }
        
        .clients-table th {
            background: var(--color-bg-secondary);
            font-weight: var(--font-weight-semibold);
            color: var(--color-text-primary);
        }
        
        .clients-table tbody tr:hover {
            background: var(--color-bg-hover);
        }
        
        .client-status {
            padding: var(--spacing-xs) var(--spacing-sm);
            border-radius: var(--border-radius-full);
            font-size: var(--font-size-xs);
            font-weight: var(--font-weight-medium);
        }
        
        .status-active {
            background: var(--color-success-light);
            color: var(--color-success);
        }
        
        .status-inactive {
            background: var(--color-danger-light);
            color: var(--color-danger);
        }
        
        .action-buttons {
            display: flex;
            gap: var(--spacing-xs);
        }
        
        .btn-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius-sm);
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .btn-edit {
            background: var(--color-warning-light);
            color: var(--color-warning);
        }
        
        .btn-edit:hover {
            background: var(--color-warning);
            color: white;
        }
        
        .btn-delete {
            background: var(--color-danger-light);
            color: var(--color-danger);
        }
        
        .btn-delete:hover {
            background: var(--color-danger);
            color: white;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: var(--z-modal);
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
            position: relative;
            z-index: var(--z-modal);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            background: var(--background-secondary);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        .form-group-full {
            grid-column: 1 / -1;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-lg);
        }
        
        .pagination button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border);
            background: white;
            color: var(--color-text-primary);
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .pagination button:hover:not(:disabled) {
            background: var(--color-primary);
            color: white;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .pagination .active {
            background: var(--color-primary);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <h1>Sistema de Gestão - Oficina Mecânica</h1>
                </div>
                <div class="user-info">
                    <span id="currentDate"></span>
                    <div class="user-menu">
                        <i class="fas fa-user-circle"></i>
                        <span>Administrador</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-menu">
        <div class="container">
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
                <a href="clientes.html" class="nav-link active">
                    <i class="fas fa-users"></i>
                    Clientes
                </a>
                <a href="veiculos.html" class="nav-link">
                    <i class="fas fa-car"></i>
                    Veículos
                </a>
                <a href="servicos.html" class="nav-link">
                    <i class="fas fa-clipboard-list"></i>
                    Ordens de Serviço
                </a>
                <a href="estoque.html" class="nav-link">
                    <i class="fas fa-boxes"></i>
                    Estoque
                </a>
                <a href="notas-fiscais.html" class="nav-link">
                    <i class="fas fa-file-invoice"></i>
                    Notas Fiscais
                </a>
                <a href="vendas.html" class="nav-link">
                    <i class="fas fa-cash-register"></i>
                    Vendas & Pagamentos
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                    <h1 class="page-title">Gerenciamento de Clientes</h1>
                </div>
                <button id="btn-novo-cliente" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Novo Cliente
                </button>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <!-- Search and Filters -->
                    <div class="search-filters">
                        <div class="filter-row">
                            <div class="form-group">
                                <label class="form-label">Buscar Cliente</label>
                                <div class="input-group">
                                    <i class="fas fa-search input-icon"></i>
                                    <input type="text" id="searchClient" class="form-control" 
                                           placeholder="Nome, CPF, telefone ou email..." 
                                           onkeyup="filterClients()">
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <select id="filterStatus" class="form-control" onchange="filterClients()">
                                    <option value="">Todos</option>
                                    <option value="ativo">Ativo</option>
                                    <option value="inativo">Inativo</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ordenar por</label>
                                <select id="sortBy" class="form-control" onchange="sortClients()">
                                    <option value="nome">Nome</option>
                                    <option value="data">Data de Cadastro</option>
                                    <option value="status">Status</option>
                                </select>
                            </div>
                            <button class="btn btn-outline" onclick="clearFilters()">
                                <i class="fas fa-times"></i> Limpar
                            </button>
                    <!-- Clients Table -->
                    <div class="clients-table-container">
                        <div class="table-header">
                            <h3><i class="fas fa-list"></i> Lista de Clientes</h3>
                            <span id="clientCount">0 clientes encontrados</span>
                        </div>
                        
                        <table class="clients-table">
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>CPF</th>
                                    <th>Telefone</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                    <th>Cadastro</th>

                                <!-- Clients will be loaded here -->

    <!-- Client Modal -->
    <div class="modal" id="clienteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="clienteModalLabel">Novo Cliente</h3>
                <button class="modal-close" onclick="closeClientModal()">&times;</button>
            </div>
            
            <form id="clientForm" class="modal-form">
                <div class="form-group">
                    <label class="form-label required">Nome Completo</label>
                    <input type="text" id="clientName" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label required">CPF</label>
                    <input type="text" id="clientCPF" class="form-control" 
                           placeholder="000.000.000-00" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label required">Telefone</label>
                    <input type="text" id="clientPhone" class="form-control" 
                           placeholder="(00) 00000-0000" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="clientEmail" class="form-control" 
                           placeholder="cliente@email.com">
                </div>
                
                <div class="form-group form-group-full">
                    <label class="form-label">Endereço</label>
                    <input type="text" id="clientAddress" class="form-control" 
                           placeholder="Rua, número, bairro, cidade - Estado">
                </div>
                
                <div class="form-group">
                    <label class="form-label">CEP</label>
                    <input type="text" id="clientCEP" class="form-control" 
                           placeholder="00000-000">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select id="clientStatus" class="form-control">
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>
                
                <div class="form-group form-group-full">
                    <label class="form-label">Observações</label>
                    <textarea id="clientNotes" class="form-control" rows="3" 
                              placeholder="Observações sobre o cliente..."></textarea>
                </div>
            </form>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" onclick="closeClientModal()">
                    Cancelar
                </button>
                <button id="salvarCliente" type="submit" form="clientForm" class="btn btn-primary">
                    <i class="fas fa-save"></i> Salvar Cliente
                </button>
            </div>
        </div>

    <!-- Scripts -->
    <script>
        // Global variables
        let clients = [];
        let filteredClients = [];
        let currentPage = 1;
        let itemsPerPage = 10;
        let editingClientId = null;

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            updateCurrentDate();
            loadClients();
            setupEventListeners();
        });

        // Update current date
        function updateCurrentDate() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            document.getElementById('currentDate').textContent = 
                now.toLocaleDateString('pt-BR', options);
        }

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('clientForm').addEventListener('submit', handleClientSubmit);
            
            // Input masks
            setupInputMasks();
        }

        // Setup input masks
        function setupInputMasks() {
            const cpfInput = document.getElementById('clientCPF');
            const phoneInput = document.getElementById('clientPhone');
            const cepInput = document.getElementById('clientCEP');

            cpfInput.addEventListener('input', function(e) {
                e.target.value = formatCPF(e.target.value);
            });

            phoneInput.addEventListener('input', function(e) {
                e.target.value = formatPhone(e.target.value);
            });

            cepInput.addEventListener('input', function(e) {
                e.target.value = formatCEP(e.target.value);
            });
        }

        // Format functions
        function formatCPF(value) {
            return value.replace(/\D/g, '')
                       .replace(/(\d{3})(\d)/, '$1.$2')
                       .replace(/(\d{3})(\d)/, '$1.$2')
                       .replace(/(\d{3})(\d{1,2})/, '$1-$2')
                       .replace(/(-\d{2})\d+?$/, '$1');
        }

        function formatPhone(value) {
            return value.replace(/\D/g, '')
                       .replace(/(\d{2})(\d)/, '($1) $2')
                       .replace(/(\d{4})(\d)/, '$1-$2')
                       .replace(/(\d{4})-(\d)(\d{4})/, '$1$2-$3')
                       .replace(/(-\d{4})\d+?$/, '$1');
        }

        function formatCEP(value) {
            return value.replace(/\D/g, '')
                       .replace(/(\d{5})(\d)/, '$1-$2')
                       .replace(/(-\d{3})\d+?$/, '$1');
        }

        // Load clients
        function loadClients() {
            // Load from localStorage or use mock data
            const savedClients = localStorage.getItem('clients');
            if (savedClients) {
                clients = JSON.parse(savedClients);
            } else {
                // Mock data
                clients = [
                    {
                        id: 1,
                        name: 'João Silva',
                        cpf: '123.456.789-00',
                        phone: '(11) 99999-9999',
                        email: 'joao@email.com',
                        address: 'Rua das Flores, 123, Centro, São Paulo - SP',
                        cep: '01234-567',
                        status: 'ativo',
                        notes: 'Cliente preferencial',
                        createdAt: '2024-01-15'
                    },
                    {
                        id: 2,
                        name: 'Maria Santos',
                        cpf: '987.654.321-00',
                        phone: '(11) 88888-8888',
                        email: 'maria@email.com',
                        address: 'Av. Paulista, 456, Bela Vista, São Paulo - SP',
                        cep: '01310-100',
                        status: 'ativo',
                        notes: '',
                        createdAt: '2024-01-20'
                    }
                ];
                saveClients();
            }
            
            filteredClients = [...clients];
            updateStatistics();
            renderClients();
        }

        // Save clients to localStorage
        function saveClients() {
            localStorage.setItem('clients', JSON.stringify(clients));
        }

        // Update statistics
        function updateStatistics() {
            const total = clients.length;
            const active = clients.filter(c => c.status === 'ativo').length;
            const thisMonth = clients.filter(c => {
                const clientDate = new Date(c.createdAt);
                const now = new Date();
                return clientDate.getMonth() === now.getMonth() && 
                       clientDate.getFullYear() === now.getFullYear();
            }).length;
            
            // Atualizar contador de clientes na tabela
            const clientCountElement = document.getElementById('clientCount');
            if (clientCountElement) {
                clientCountElement.textContent = `${total} clientes encontrados`;
            }
        }

        // Filter clients
        function filterClients() {
            const searchTerm = document.getElementById('searchClient').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            
            filteredClients = clients.filter(client => {
                const matchesSearch = !searchTerm || 
                    client.name.toLowerCase().includes(searchTerm) ||
                    client.cpf.includes(searchTerm) ||
                    client.phone.includes(searchTerm) ||
                    client.email.toLowerCase().includes(searchTerm);
                
                const matchesStatus = !statusFilter || client.status === statusFilter;
                
                return matchesSearch && matchesStatus;
            });
            
            currentPage = 1;
            renderClients();
        }

        // Sort clients
        function sortClients() {
            const sortBy = document.getElementById('sortBy').value;
            
            filteredClients.sort((a, b) => {
                switch(sortBy) {
                    case 'nome':
                        return a.name.localeCompare(b.name);
                    case 'data':
                        return new Date(b.createdAt) - new Date(a.createdAt);
                    case 'status':
                        return a.status.localeCompare(b.status);
                    default:
                        return 0;
                }
            });
            
            renderClients();
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('searchClient').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('sortBy').value = 'nome';
            filteredClients = [...clients];
            currentPage = 1;
            renderClients();
        }

        // Render clients table
        function renderClients() {
            const tbody = document.getElementById('clientsTableBody');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageClients = filteredClients.slice(startIndex, endIndex);
            
            tbody.innerHTML = '';
            
            if (pageClients.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center">
                            <i class="fas fa-users"></i> Nenhum cliente encontrado
                        </td>
                    </tr>
                `;
            } else {
                pageClients.forEach(client => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${client.name}</strong></td>
                        <td>${client.cpf}</td>
                        <td>${client.phone}</td>
                        <td>${client.email || '-'}</td>
                        <td>
                            <span class="client-status status-${client.status}">
                                ${client.status === 'ativo' ? 'Ativo' : 'Inativo'}
                            </span>
                        </td>
                        <td>${formatDate(client.createdAt)}</td>
                        <td>
                            <div class="action-buttons">
                                <button class="btn-icon btn-edit" onclick="editClient(${client.id})" 
                                        title="Editar">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-icon btn-delete" onclick="deleteClient(${client.id})" 
                                        title="Excluir">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
            
            updateClientCount();
            renderPagination();
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR');
        }

        // Update client count
        function updateClientCount() {
            document.getElementById('clientCount').textContent = 
                `${filteredClients.length} cliente${filteredClients.length !== 1 ? 's' : ''} encontrado${filteredClients.length !== 1 ? 's' : ''}`;
        }

        // Render pagination
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredClients.length / itemsPerPage);
            
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            
            let paginationHTML = '';
            
            // Previous button
            paginationHTML += `
                <button onclick="changePage(${currentPage - 1})" 
                        ${currentPage === 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
            `;
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    paginationHTML += `<button class="active">${i}</button>`;
                } else {
                    paginationHTML += `<button onclick="changePage(${i})">${i}</button>`;
                }
            }
            
            // Next button
            paginationHTML += `
                <button onclick="changePage(${currentPage + 1})" 
                        ${currentPage === totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
            `;
            
            pagination.innerHTML = paginationHTML;
        }

        // Change page
        function changePage(page) {
            const totalPages = Math.ceil(filteredClients.length / itemsPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderClients();
            }
        }

        // Open client modal
        function openClientModal() {
            editingClientId = null;
            document.getElementById('clienteModalLabel').textContent = 'Novo Cliente';
            document.getElementById('clientForm').reset();
            document.getElementById('clienteModal').style.display = 'flex';
        }

        // Close client modal
        function closeClientModal() {
            document.getElementById('clienteModal').style.display = 'none';
            editingClientId = null;
        }

        // Edit client
        function editClient(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;
            
            editingClientId = id;
            document.getElementById('modalTitle').textContent = 'Editar Cliente';
            
            // Fill form
            document.getElementById('clientName').value = client.name;
            document.getElementById('clientCPF').value = client.cpf;
            document.getElementById('clientPhone').value = client.phone;
            document.getElementById('clientEmail').value = client.email || '';
            document.getElementById('clientAddress').value = client.address || '';
            document.getElementById('clientCEP').value = client.cep || '';
            document.getElementById('clientStatus').value = client.status;
            document.getElementById('clientNotes').value = client.notes || '';
            
            document.getElementById('clienteModal').style.display = 'flex';
        }

        // Handle client form submit
        function handleClientSubmit(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('clientName').value,
                cpf: document.getElementById('clientCPF').value,
                phone: document.getElementById('clientPhone').value,
                email: document.getElementById('clientEmail').value,
                address: document.getElementById('clientAddress').value,
                cep: document.getElementById('clientCEP').value,
                status: document.getElementById('clientStatus').value,
                notes: document.getElementById('clientNotes').value
            };
            
            // Validate required fields
            if (!formData.name || !formData.cpf || !formData.phone) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }
            
            // Validate CPF uniqueness
            const existingClient = clients.find(c => 
                c.cpf === formData.cpf && c.id !== editingClientId
            );
            if (existingClient) {
                alert('Já existe um cliente cadastrado com este CPF.');
                return;
            }
            
            if (editingClientId) {
                // Update existing client
                const clientIndex = clients.findIndex(c => c.id === editingClientId);
                clients[clientIndex] = { ...clients[clientIndex], ...formData };
            } else {
                // Add new client
                const newClient = {
                    id: Date.now(),
                    ...formData,
                    createdAt: new Date().toISOString().split('T')[0]
                };
                clients.push(newClient);
            }
            
            saveClients();
            loadClients();
            closeClientModal();
            
            // Show success message
            showNotification(
                editingClientId ? 'Cliente atualizado com sucesso!' : 'Cliente cadastrado com sucesso!',
                'success'
            );
        }

        // Delete client
        function deleteClient(id) {
            const client = clients.find(c => c.id === id);
            if (!client) return;
            
            if (confirm(`Tem certeza que deseja excluir o cliente "${client.name}"?`)) {
                clients = clients.filter(c => c.id !== id);
                saveClients();
                loadClients();
                showNotification('Cliente excluído com sucesso!', 'success');
            }
        }

        // Export clients
        function exportClients() {
            const dataStr = JSON.stringify(clients, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'clientes.json';
            link.click();
            URL.revokeObjectURL(url);
        }

        // Import clients (placeholder)
        function importClients() {
            alert('Funcionalidade de importação será implementada em breve.');
        }

        // Show notification
        function showNotification(message, type = 'info') {
            // Simple notification - can be enhanced with a proper notification system
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 1rem 1.5rem;
                background: var(--color-${type === 'success' ? 'success' : 'primary'});
                color: white;
                border-radius: var(--border-radius-md);
                box-shadow: var(--shadow-lg);
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Logout function
        function logout() {
            if (confirm('Tem certeza que deseja sair?')) {
                localStorage.removeItem('usuarioLogado');
                sessionStorage.removeItem('usuarioLogado');
                window.location.href = '../login.html';
            }
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('clienteModal');
            if (event.target === modal) {
                closeClientModal();
            }
        }
    </script>
