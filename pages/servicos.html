<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços - Oficina Mecânica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
</head>
<body>
    <div class="main-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="header-container"></div>
            <div class="page-header">
                <h1 class="page-title">Gerenciamento de Serviços</h1>
                <button class="btn btn-primary" id="btn-novo-servico"><i class="fas fa-plus"></i> Novo Serviço</button>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <div class="filter-container">
                        <div class="search-box">
                            <input type="text" id="search-servico" class="form-control" placeholder="Buscar serviço...">
                            <button class="btn btn-outline-primary"><i class="fas fa-search"></i></button>
                        </div>
                        <div class="filter-options">
                            <select id="filter-categoria" class="form-select">
                                <option value="">Todas as categorias</option>
                                <option value="manutencao">Manutenção</option>
                                <option value="revisao">Revisão</option>
                                <option value="reparo">Reparo</option>
                                <option value="eletrica">Elétrica</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Lista de Serviços</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Descrição</th>
                                    <th>Valor</th>
                                    <th>Tempo Previsto</th>
                                    <th>Categoria</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="servicos-table-body">
                                <!-- Dados serão carregados via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="servico-modal-container"></div>
    <div id="footer-container"></div>
    
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/modules/servicos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('../components/sidebar.html').then(r => r.text()).then(d => document.getElementById('sidebar-container').innerHTML = d);
            fetch('../components/header.html').then(r => r.text()).then(d => document.getElementById('header-container').innerHTML = d);
            fetch('../components/modals/servico-modal.html').then(r => r.text()).then(d => document.getElementById('servico-modal-container').innerHTML = d);
            fetch('../components/footer.html').then(r => r.text()).then(d => document.getElementById('footer-container').innerHTML = d);
        });
    </script>
</body>
</html>
