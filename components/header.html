<!-- Header Component -->
<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-wrench"></i>
                <h1>Sistema de Gestão - Oficina Mecânica</h1>
            </div>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" placeholder="Buscar..." id="global-search">
                    <i class="fas fa-search"></i>
                </div>
                <div class="user-info">
                    <span id="current-date"></span>
                    <div class="user-menu">
                        <i class="fas fa-user-circle"></i>
                        <span class="user-name">Usuário</span>
                        <div class="dropdown">
                            <a href="#perfil"><i class="fas fa-user"></i> Perfil</a>
                            <a href="#configuracoes"><i class="fas fa-cog"></i> Configurações</a>
                            <a href="#logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <p class="header-subtitle">Gestão completa para sua oficina automotiva</p>
    </div>
</header>

<script>
// Atualizar data atual
function atualizarDataAtual() {
    const agora = new Date();
    const opcoes = { 
        weekday: 'long', 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
    };
    const dataFormatada = agora.toLocaleDateString('pt-BR', opcoes);
    const currentDateElement = document.getElementById('current-date');
    if (currentDateElement) {
        currentDateElement.textContent = dataFormatada;
    }
}

// Atualizar data a cada minuto
setInterval(atualizarDataAtual, 60000);
atualizarDataAtual();
</script>
