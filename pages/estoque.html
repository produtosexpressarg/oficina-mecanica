<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque - Oficina Mecânica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <div class="main-container">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>

        <!-- Conteúdo principal -->
        <div class="main-content">
            <!-- Header -->
            <div id="header-container"></div>

            <!-- Conteúdo da página -->
            <div class="page-header">
                <h1 class="page-title">Gerenciamento de Estoque</h1>
                <button class="btn btn-primary" id="btn-novo-produto">
                    <i class="fas fa-plus"></i> Novo Produto
                </button>
            </div>

            <!-- Filtros e busca -->
            <div class="card">
                <div class="card-body">
                    <div class="filter-container">
                        <div class="search-box">
                            <input type="text" id="search-produto" class="form-control" placeholder="Buscar produto...">
                            <button class="btn btn-outline-primary">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                        <div class="filter-options">
                            <select id="filter-categoria" class="form-select">
                                <option value="">Todas as categorias</option>
                                <option value="oleos_lubrificantes">Óleos e Lubrificantes</option>
                                <option value="filtros">Filtros</option>
                                <option value="freios">Freios</option>
                                <option value="suspensao">Suspensão</option>
                                <option value="eletrica">Elétrica</option>
                                <option value="ignicao">Ignição</option>
                            </select>
                            <select id="filter-estoque" class="form-select">
                                <option value="">Status de estoque</option>
                                <option value="disponivel">Disponível</option>
                                <option value="baixo">Estoque baixo</option>
                                <option value="esgotado">Esgotado</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabela de produtos -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Produtos em Estoque</h2>
                    <div class="card-tools">
                        <button class="btn btn-sm btn-outline-secondary" id="btn-exportar">
                            <i class="fas fa-file-export"></i> Exportar
                        </button>
                        <button class="btn btn-sm btn-outline-secondary" id="btn-imprimir">
                            <i class="fas fa-print"></i> Imprimir
                        </button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nome</th>
                                    <th>Categoria</th>
                                    <th>Marca</th>
                                    <th>Estoque</th>
                                    <th>Estoque Mín.</th>
                                    <th>Preço Compra</th>
                                    <th>Preço Venda</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="produtos-table-body">
                                <!-- Dados serão carregados via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination-container">
                        <div class="items-per-page">
                            <span>Itens por página:</span>
                            <select id="items-per-page" class="form-select form-select-sm">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <div class="pagination" id="pagination">
                            <!-- Paginação será gerada via JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Estatísticas de estoque -->
            <div class="row">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Valor total em estoque</h3>
                        </div>
                        <div class="card-body">
                            <div class="stat-value" id="valor-total-estoque">R$ 0,00</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Produtos com estoque baixo</h3>
                        </div>
                        <div class="card-body">
                            <div class="stat-value" id="produtos-estoque-baixo">0</div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Total de produtos</h3>
                        </div>
                        <div class="card-body">
                            <div class="stat-value" id="total-produtos">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de produto -->
    <div id="produto-modal-container"></div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/modules/estoque.js"></script>
    <script>
        // Carregar componentes
        document.addEventListener('DOMContentLoaded', function() {
            // Carregar sidebar
            fetch('../components/sidebar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sidebar-container').innerHTML = data;
                });
            
            // Carregar header
            fetch('../components/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-container').innerHTML = data;
                });
            
            // Carregar modal de produto
            fetch('../components/modals/produto-modal.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('produto-modal-container').innerHTML = data;
                });
            
            // Carregar footer
            fetch('../components/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                });
        });
    </script>
</body>
</html>
