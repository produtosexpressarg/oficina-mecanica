<!-- Modal Nuevo Cliente -->
<div class="modal fade" id="clienteModal" tabindex="-1" aria-labelledby="clienteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="clienteModalLabel">Nuevo Cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="clienteForm">
                    <!-- Informaciones Básicas -->
                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="nomeCliente" class="form-label">Nombre Completo *</label>
                                <input type="text" class="form-control" id="nomeCliente" name="nome" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="tipoCliente" class="form-label">Tipo *</label>
                                <select class="form-select" id="tipoCliente" name="tipo" required onchange="toggleDocumento()">
                                    <option value="">Seleccione</option>
                                    <option value="pessoa_fisica">Persona Física</option>
                                    <option value="pessoa_juridica">Persona Jurídica</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Documentos -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group" id="cpf-group">
                                <label for="cpfCliente" class="form-label">CUIL/DNI *</label>
                                <input type="text" class="form-control" id="cpfCliente" name="cpf" placeholder="00.000.000-0">
                            </div>
                            <div class="form-group" id="cnpj-group" style="display: none;">
                                <label for="cnpjCliente" class="form-label">CUIT *</label>
                                <input type="text" class="form-control" id="cnpjCliente" name="cnpj" placeholder="00-00000000-0">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group" id="rg-group">
                                <label for="rgCliente" class="form-label">DNI</label>
                                <input type="text" class="form-control" id="rgCliente" name="rg">
                            </div>
                            <div class="form-group" id="ie-group" style="display: none;">
                                <label for="ieCliente" class="form-label">Inscripción Ingresos Brutos</label>
                                <input type="text" class="form-control" id="ieCliente" name="inscricao_estadual">
                            </div>
                        </div>
                    </div>

                    <!-- Contacto -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="telefoneCliente" class="form-label">Teléfono *</label>
                                <input type="tel" class="form-control" id="telefoneCliente" name="telefone" placeholder="(000) 0000-0000" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="emailCliente" class="form-label">Email</label>
                                <input type="email" class="form-control" id="emailCliente" name="email" placeholder="cliente@email.com">
                            </div>
                        </div>
                    </div>

                    <!-- Dirección -->
                    <h6 class="mt-4 mb-3"><i class="fas fa-map-marker-alt"></i> Dirección</h6>
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="cepCliente" class="form-label">CPA</label>
                                <input type="text" class="form-control" id="cepCliente" name="cep" placeholder="A0000AAA" onblur="buscarCEP()">
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="form-group">
                                <label for="enderecoCliente" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="enderecoCliente" name="endereco">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group">
                                <label for="numeroCliente" class="form-label">Número</label>
                                <input type="text" class="form-control" id="numeroCliente" name="numero">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="complementoCliente" class="form-label">Complemento</label>
                                <input type="text" class="form-control" id="complementoCliente" name="complemento">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="bairroCliente" class="form-label">Barrio</label>
                                <input type="text" class="form-control" id="bairroCliente" name="bairro">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="cidadeCliente" class="form-label">Ciudad</label>
                                <input type="text" class="form-control" id="cidadeCliente" name="cidade">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="estadoCliente" class="form-label">Provincia</label>
                                <select class="form-select" id="estadoCliente" name="estado">
                                    <option value="">Seleccione</option>
                                    <option value="CABA">CABA</option>
                                    <option value="Buenos Aires">Buenos Aires</option>
                                    <option value="Catamarca">Catamarca</option>
                                    <option value="Chaco">Chaco</option>
                                    <option value="Chubut">Chubut</option>
                                    <option value="Córdoba">Córdoba</option>
                                    <option value="Corrientes">Corrientes</option>
                                    <option value="Entre Ríos">Entre Ríos</option>
                                    <option value="Formosa">Formosa</option>
                                    <option value="Jujuy">Jujuy</option>
                                    <option value="La Pampa">La Pampa</option>
                                    <option value="La Rioja">La Rioja</option>
                                    <option value="Mendoza">Mendoza</option>
                                    <option value="Misiones">Misiones</option>
                                    <option value="Neuquén">Neuquén</option>
                                    <option value="Río Negro">Río Negro</option>
                                    <option value="Salta">Salta</option>
                                    <option value="San Juan">San Juan</option>
                                    <option value="San Luis">San Luis</option>
                                    <option value="Santa Cruz">Santa Cruz</option>
                                    <option value="Santa Fe">Santa Fe</option>
                                    <option value="Santiago del Estero">Santiago del Estero</option>
                                    <option value="Tierra del Fuego">Tierra del Fuego</option>
                                    <option value="Tucumán">Tucumán</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="statusCliente" class="form-label">Estado</label>
                                <select class="form-select" id="statusCliente" name="status">
                                    <option value="ativo">Activo</option>
                                    <option value="inativo">Inactivo</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Observaciones -->
                    <div class="form-group">
                        <label for="observacoesCliente" class="form-label">Observaciones</label>
                        <textarea class="form-control" id="observacoesCliente" name="observacoes" rows="3" placeholder="Observaciones adicionales sobre el cliente..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="button" class="btn btn-primary" id="salvarCliente">
                    <i class="fas fa-save"></i> Guardar Cliente
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function toggleDocumento() {
    const tipo = document.getElementById('tipoCliente').value;
    const cpfGroup = document.getElementById('cpf-group');
    const cnpjGroup = document.getElementById('cnpj-group');
    const rgGroup = document.getElementById('rg-group');
    const ieGroup = document.getElementById('ie-group');

    if (tipo === 'pessoa_fisica') {
        cpfGroup.style.display = 'block';
        cnpjGroup.style.display = 'none';
        rgGroup.style.display = 'block';
        ieGroup.style.display = 'none';
        
        document.getElementById('cpfCliente').required = true;
        document.getElementById('cnpjCliente').required = false;
    } else if (tipo === 'pessoa_juridica') {
        cpfGroup.style.display = 'none';
        cnpjGroup.style.display = 'block';
        rgGroup.style.display = 'none';
        ieGroup.style.display = 'block';
        
        document.getElementById('cpfCliente').required = false;
        document.getElementById('cnpjCliente').required = true;
    } else {
        cpfGroup.style.display = 'block';
        cnpjGroup.style.display = 'none';
        rgGroup.style.display = 'block';
        ieGroup.style.display = 'none';
    }
}

function buscarCEP() {
    const cep = document.getElementById('cepCliente').value.replace(/\D/g, '');
    
    if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(response => response.json())
            .then(data => {
                if (!data.erro) {
                    document.getElementById('enderecoCliente').value = data.logradouro;
                    document.getElementById('bairroCliente').value = data.bairro;
                    document.getElementById('cidadeCliente').value = data.localidade;
                    document.getElementById('estadoCliente').value = data.uf;
                }
            })
            .catch(error => console.log('Error al buscar CPA:', error));
    }
}

// Máscaras para los campos
document.addEventListener('DOMContentLoaded', function() {
    // Máscara CUIL/DNI
    document.getElementById('cpfCliente').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/(\d{2})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = value;
    });

    // Máscara CUIT
    document.getElementById('cnpjCliente').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/(\d{2})(\d)/, '$1-$2');
        value = value.replace(/(\d{8})(\d)/, '$1-$2');
        e.target.value = value;
    });

    // Máscara Teléfono
    document.getElementById('telefoneCliente').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/(\d{3})(\d)/, '($1) $2');
        value = value.replace(/(\d{4})(\d{1,4})$/, '$1-$2');
        e.target.value = value;
    });

    // Máscara CPA
    document.getElementById('cepCliente').addEventListener('input', function(e) {
        let value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (value.length > 4) {
            value = value.substring(0, 4) + value.substring(4, 8);
        }
        e.target.value = value;
    });
});
</script>
