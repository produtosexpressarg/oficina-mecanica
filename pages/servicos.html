<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestão de Serviços - Sistema de Gestão para Oficina Mecânica">
    <title>Serviços - Sistema de Gestão Oficina</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../assets/css/design-system.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: var(--z-modal);
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            border-radius: var(--border-radius);
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
            position: relative;
            z-index: var(--z-modal);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            background: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            background: var(--background-secondary);
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        .form-group-full {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <h1>Sistema de Gestão - Oficina Mecânica</h1>
                </div>
                <div class="user-info">
                    <span id="currentDate"></span>
                    <div class="user-menu">
                        <i class="fas fa-user-circle"></i>
                        <span>Administrador</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-menu">
        <div class="container">
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
                <a href="clientes.html" class="nav-link">
                    <i class="fas fa-users"></i>
                    Clientes
                </a>
                <a href="veiculos.html" class="nav-link">
                    <i class="fas fa-car"></i>
                    Veículos
                </a>
                <a href="servicos.html" class="nav-link active">
                    <i class="fas fa-clipboard-list"></i>
                    Ordens de Serviço
                </a>
                <a href="estoque.html" class="nav-link">
                    <i class="fas fa-boxes"></i>
                    Estoque
                </a>
                <a href="notas-fiscais.html" class="nav-link">
                    <i class="fas fa-file-invoice"></i>
                    Notas Fiscais
                </a>
                <a href="vendas.html" class="nav-link">
                    <i class="fas fa-cash-register"></i>
                    Vendas & Pagamentos
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                    <h1 class="page-title">Gerenciamento de Serviços</h1>
                </div>
                <button id="btn-novo-servico" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Novo Serviço
                </button>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <div class="filter-container">
                        <div class="search-box">
                            <input type="text" id="search-servico" class="form-control" placeholder="Buscar serviço...">
                            <button class="btn btn-outline-primary"><i class="fas fa-search"></i></button>
                        </div>
                        <div class="filter-options">
                            <select id="filter-categoria" class="form-select">
                                <option value="">Todas as categorias</option>
                                <option value="manutencao">Manutenção</option>
                                <option value="revisao">Revisão</option>
                                <option value="reparo">Reparo</option>
                                <option value="eletrica">Elétrica</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Lista de Serviços</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Descrição</th>
                                    <th>Valor</th>
                                    <th>Tempo Previsto</th>
                                    <th>Categoria</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="servicos-table-body">
                                <!-- Dados serão carregados via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="servico-modal-container"></div>
    <div id="footer-container"></div>
    
    <script src="../assets/js/app.js"></script>
    <script src="../js/servicos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('../components/sidebar.html').then(r => r.text()).then(d => {
            const sidebarContainer = document.getElementById('sidebar-container');
            if (sidebarContainer) {
                sidebarContainer.innerHTML = d;
            }
        });
        fetch('../components/header.html').then(r => r.text()).then(d => {
            const headerContainer = document.getElementById('header-container');
            if (headerContainer) {
                headerContainer.innerHTML = d;
            }
        });
        fetch('../components/modals/servico-modal.html').then(r => r.text()).then(d => {
            const modalContainer = document.getElementById('servico-modal-container');
            if (modalContainer) {
                modalContainer.innerHTML = d;
            }
        });
        fetch('../components/footer.html').then(r => r.text()).then(d => {
            const footerContainer = document.getElementById('footer-container');
            if (footerContainer) {
                footerContainer.innerHTML = d;
            }
        });
        });
    </script>
        </div>
    </main>
</body>
</html>
