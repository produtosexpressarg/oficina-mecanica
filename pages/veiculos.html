<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos - Oficina Mecânica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/layout.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
</head>
<body>
    <div class="main-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div id="header-container"></div>
            <div class="page-header">
                <h1 class="page-title">Gerenciamento de Veículos</h1>
                <button class="btn btn-primary" id="btn-novo-veiculo"><i class="fas fa-plus"></i> Novo Veículo</button>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <div class="filter-container">
                        <div class="search-box">
                            <input type="text" id="search-veiculo" class="form-control" placeholder="Buscar veículo...">
                            <button class="btn btn-outline-primary"><i class="fas fa-search"></i></button>
                        </div>
                        <div class="filter-options">
                            <select id="filter-marca" class="form-select">
                                <option value="">Todas as marcas</option>
                                <option value="volkswagen">Volkswagen</option>
                                <option value="fiat">Fiat</option>
                                <option value="chevrolet">Chevrolet</option>
                                <option value="ford">Ford</option>
                                <option value="toyota">Toyota</option>
                            </select>
                            <select id="filter-cliente" class="form-select">
                                <option value="">Todos os clientes</option>
                                <!-- Opções serão carregadas via JavaScript -->
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Lista de Veículos</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Placa</th>
                                    <th>Marca</th>
                                    <th>Modelo</th>
                                    <th>Ano</th>
                                    <th>Cor</th>
                                    <th>Cliente</th>
                                    <th>Última Revisão</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="veiculos-table-body">
                                <!-- Dados serão carregados via JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="veiculo-modal-container"></div>
    <div id="footer-container"></div>
    
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/modules/veiculos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch('../components/sidebar.html').then(r => r.text()).then(d => document.getElementById('sidebar-container').innerHTML = d);
            fetch('../components/header.html').then(r => r.text()).then(d => document.getElementById('header-container').innerHTML = d);
            fetch('../components/modals/veiculo-modal.html').then(r => r.text()).then(d => document.getElementById('veiculo-modal-container').innerHTML = d);
            fetch('../components/footer.html').then(r => r.text()).then(d => document.getElementById('footer-container').innerHTML = d);
        });
    </script>
</body>
</html>
