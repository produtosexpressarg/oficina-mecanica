<!-- Modal de Producto -->
<div id="produto-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title" id="produto-modal-title">Nuevo Producto</h3>
            <button type="button" class="modal-close" onclick="fecharModalProduto()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="produto-form" onsubmit="salvarProduto(event)">
                <input type="hidden" id="produto-id" name="id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="produto-codigo">Código del Producto *</label>
                        <input type="text" id="produto-codigo" name="codigo" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="produto-nome">Nombre del Producto *</label>
                        <input type="text" id="produto-nome" name="nome" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="produto-categoria">Categoría *</label>
                        <select id="produto-categoria" name="categoria" class="form-control" required>
                            <option value="">Seleccione una categoría</option>
                            <option value="oleos_lubrificantes">Aceites y Lubricantes</option>
                            <option value="filtros">Filtros</option>
                            <option value="freios">Frenos</option>
                            <option value="suspensao">Suspensión</option>
                            <option value="eletrica">Eléctrica</option>
                            <option value="ignicao">Ignición</option>
                            <option value="pneus">Cubiertas</option>
                            <option value="bateria">Batería</option>
                            <option value="outros">Otros</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="produto-marca">Marca</label>
                        <input type="text" id="produto-marca" name="marca" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label for="produto-descricao">Descripción</label>
                    <textarea id="produto-descricao" name="descricao" class="form-control" rows="3"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="produto-estoque-atual">Stock Actual *</label>
                        <input type="number" id="produto-estoque-atual" name="estoque_atual" class="form-control" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="produto-estoque-minimo">Stock Mínimo *</label>
                        <input type="number" id="produto-estoque-minimo" name="estoque_minimo" class="form-control" min="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="produto-preco-custo" class="required">Precio Costo</label>
                        <input type="text" id="produto-preco-custo" name="preco_custo" class="form-control" data-mask="moeda" required>
                    </div>
                    <div class="form-group">
                        <label for="produto-preco-venda" class="required">Precio Venta</label>
                        <input type="text" id="produto-preco-venda" name="preco_venda" class="form-control" data-mask="moeda" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="produto-unidade">Unidad de Medida *</label>
                        <select id="produto-unidade" name="unidade" class="form-control" required>
                            <option value="">Seleccione</option>
                            <option value="UN">Unidad</option>
                            <option value="PC">Pieza</option>
                            <option value="LT">Litro</option>
                            <option value="ML">Mililitro</option>
                            <option value="KG">Kilogramo</option>
                            <option value="G">Gramo</option>
                            <option value="M">Metro</option>
                            <option value="CM">Centímetro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="produto-localizacao">Ubicación</label>
                        <input type="text" id="produto-localizacao" name="localizacao" class="form-control" placeholder="Ej: Estante A-1">
                    </div>
                </div>

                <div class="form-group">
                    <label for="produto-fornecedor">Proveedor</label>
                    <input type="text" id="produto-fornecedor" name="fornecedor" class="form-control">
                </div>

                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="produto-ativo" name="ativo" class="form-check-input" checked>
                        <label for="produto-ativo" class="form-check-label">Producto Activo</label>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="fecharModalProduto()">
                <i class="fas fa-times"></i> Cancelar
            </button>
            <button type="submit" form="produto-form" class="btn btn-primary">
                <i class="fas fa-save"></i> Guardar Producto
            </button>
        </div>
    </div>
</div>

<script>
function abrirModalProduto(id = null) {
    const modal = document.getElementById('produto-modal');
    const title = document.getElementById('produto-modal-title');
    
    if (id) {
        title.textContent = 'Editar Producto';
        carregarDadosProduto(id);
    } else {
        title.textContent = 'Nuevo Producto';
        document.getElementById('produto-form').reset();
        document.getElementById('produto-ativo').checked = true;
    }
    
    modal.style.display = 'block';
    modal.classList.add('show');
}

function fecharModalProduto() {
    const modal = document.getElementById('produto-modal');
    modal.style.display = 'none';
    modal.classList.remove('show');
    document.getElementById('produto-form').reset();
}

function salvarProduto(event) {
    event.preventDefault();
    
    const formData = new FormData(event.target);
    const produto = Object.fromEntries(formData.entries());
    
    // Validaciones
    if (!produto.codigo || !produto.nome || !produto.categoria) {
        alert('Por favor, complete todos los campos obligatorios.');
        return;
    }
    
    if (parseFloat(produto.preco_venda) <= parseFloat(produto.preco_custo)) {
        if (!confirm('El precio de venta es menor o igual al precio de costo. ¿Desea continuar?')) {
            return;
        }
    }
    
    // Simular guardado
    console.log('Guardando producto:', produto);
    
    // Aquí implementaría la llamada para la API
    // Por ahora, solo cerramos el modal
    fecharModalProduto();
    
    // Recargar la tabla de productos
    if (typeof carregarProdutos === 'function') {
        carregarProdutos();
    }
    
    alert('Producto guardado con éxito!');
}

function carregarDadosProduto(id) {
    // Implementar carga de datos del producto
    console.log('Cargando datos del producto:', id);
    
    // Ejemplo de datos mockeados
    const produtoMock = {
        id: id,
        codigo: 'PROD001',
        nome: 'Aceite Motor 5W30',
        categoria: 'oleos_lubrificantes',
        marca: 'Castrol',
        descricao: 'Aceite sintético para motor',
        estoque_atual: 50,
        estoque_minimo: 10,
        preco_custo: 25.00,
        preco_venda: 35.00,
        unidade: 'LT',
        localizacao: 'A-1',
        fornecedor: 'Distribuidora ABC',
        ativo: true
    };
    
    // Llenar el formulario
    Object.keys(produtoMock).forEach(key => {
        const element = document.getElementById(`produto-${key.replace('_', '-')}`);
        if (element) {
            if (element.type === 'checkbox') {
                element.checked = produtoMock[key];
            } else {
                element.value = produtoMock[key];
            }
        }
    });
}

// Cerrar modal al hacer clic fuera de él
document.addEventListener('click', function(event) {
    const modal = document.getElementById('produto-modal');
    if (event.target === modal) {
        fecharModalProduto();
    }
});
</script>
