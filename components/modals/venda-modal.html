<!-- Modal de Venta -->
<div id="venda-modal" class="modal">
    <div class="modal-content modal-lg">
        <div class="modal-header">
            <h3 class="modal-title" id="venda-modal-title">Nueva Venta</h3>
            <button type="button" class="modal-close" onclick="fecharModalVenda()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="venda-form" onsubmit="salvarVenda(event)">
                <input type="hidden" id="venda-id" name="id">
                
                <!-- Informaciones del Cliente -->
                <div class="form-section">
                    <h4><i class="fas fa-user"></i> Informaciones del Cliente</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="venda-cliente">Cliente *</label>
                            <select id="venda-cliente" name="cliente_id" class="form-control" required onchange="carregarVeiculosCliente()">
                                <option value="">Seleccione un cliente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="venda-veiculo">Vehículo</label>
                            <select id="venda-veiculo" name="veiculo_id" class="form-control">
                                <option value="">Seleccione un vehículo</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Productos/Servicios -->
                <div class="form-section">
                    <h4><i class="fas fa-shopping-cart"></i> Elementos de la Venta</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="item-tipo">Tipo de Elemento</label>
                            <select id="item-tipo" class="form-control" onchange="carregarItensDisponiveis()">
                                <option value="">Seleccione el tipo</option>
                                <option value="produto">Producto</option>
                                <option value="servico">Servicio</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="item-disponivel">Elemento</label>
                            <select id="item-disponivel" class="form-control">
                                <option value="">Seleccione un elemento</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="item-quantidade">Cantidad</label>
                            <input type="number" id="item-quantidade" class="form-control" min="1" value="1">
                        </div>
                        <div class="form-group">
                            <button type="button" class="btn btn-success" onclick="adicionarItem()">
                                <i class="fas fa-plus"></i> Agregar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Lista de Elementos -->
                <div class="form-section">
                    <div class="table-responsive">
                        <table class="table" id="itens-venda-table">
                            <thead>
                                <tr>
                                    <th>Elemento</th>
                                    <th>Tipo</th>
                                    <th>Cant</th>
                                    <th>Valor Unit.</th>
                                    <th>Total</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="itens-venda-body">
                                <tr class="empty-state">
                                    <td colspan="6" class="text-center">Ningún elemento agregado</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Totales -->
                <div class="form-section">
                    <div class="totals-container">
                        <div class="total-row">
                            <span>Subtotal:</span>
                            <span id="venda-subtotal">$ 0,00</span>
                        </div>
                        <div class="total-row">
                            <label for="venda-desconto">Descuento (%):</label>
                            <input type="number" id="venda-desconto" name="desconto" class="form-control" min="0" max="100" step="0.01" value="0" onchange="calcularTotais()">
                        </div>
                        <div class="total-row">
                            <span>Valor del Descuento:</span>
                            <span id="venda-valor-desconto">$ 0,00</span>
                        </div>
                        <div class="total-row total-final">
                            <span>Total Final:</span>
                            <span id="venda-total">$ 0,00</span>
                        </div>
                    </div>
                </div>

                <!-- Forma de Pago -->
                <div class="form-section">
                    <h4><i class="fas fa-credit-card"></i> Pago</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="venda-forma-pagamento">Forma de Pago *</label>
                            <select id="venda-forma-pagamento" name="forma_pagamento" class="form-control" required>
                                <option value="">Seleccione</option>
                                <option value="dinheiro">Efectivo</option>
                                <option value="cartao_debito">Tarjeta de Débito</option>
                                <option value="cartao_credito">Tarjeta de Crédito</option>
                                <option value="pix">Transferencia</option>
                                <option value="transferencia">Transferencia Bancaria</option>
                                <option value="cheque">Cheque</option>
                                <option value="prazo">A Plazo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="venda-status-pagamento">Estado del Pago *</label>
                            <select id="venda-status-pagamento" name="status_pagamento" class="form-control" required>
                                <option value="pendente">Pendiente</option>
                                <option value="pago">Pagado</option>
                                <option value="parcial">Parcial</option>
                                <option value="cancelado">Cancelado</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row" id="parcelas-container" style="display: none;">
                        <div class="form-group">
                            <label for="venda-parcelas">Número de Cuotas</label>
                            <input type="number" id="venda-parcelas" name="parcelas" class="form-control" min="1" max="12">
                        </div>
                        <div class="form-group">
                            <label for="venda-data-vencimento">Fecha de Vencimiento</label>
                            <input type="date" id="venda-data-vencimento" name="data_vencimento" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Observaciones -->
                <div class="form-section">
                    <div class="form-group">
                        <label for="venda-observacoes">Observaciones</label>
                        <textarea id="venda-observacoes" name="observacoes" class="form-control" rows="3"></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="fecharModalVenda()">
                <i class="fas fa-times"></i> Cancelar
            </button>
            <button type="submit" form="venda-form" class="btn btn-primary">
                <i class="fas fa-save"></i> Guardar Venta
            </button>
        </div>
    </div>
</div>

<script>
let itensVenda = [];

function abrirModalVenda(id = null) {
    const modal = document.getElementById('venda-modal');
    const title = document.getElementById('venda-modal-title');
    
    if (id) {
        title.textContent = 'Editar Venta';
        carregarDadosVenda(id);
    } else {
        title.textContent = 'Nueva Venta';
        document.getElementById('venda-form').reset();
        itensVenda = [];
        atualizarTabelaItens();
        calcularTotais();
    }
    
    carregarClientes();
    modal.style.display = 'block';
    modal.classList.add('show');
}

function fecharModalVenda() {
    const modal = document.getElementById('venda-modal');
    modal.style.display = 'none';
    modal.classList.remove('show');
    document.getElementById('venda-form').reset();
    itensVenda = [];
}

function carregarClientes() {
    const select = document.getElementById('venda-cliente');
    select.innerHTML = '<option value="">Seleccione un cliente</option>';
    
    // Simular carga de clientes
    const clientesMock = [
        { id: 1, nome: 'Juan Pérez' },
        { id: 2, nome: 'María Gómez' },
        { id: 3, nome: 'Pedro Rodríguez' }
    ];
    
    clientesMock.forEach(cliente => {
        const option = document.createElement('option');
        option.value = cliente.id;
        option.textContent = cliente.nome;
        select.appendChild(option);
    });
}

function carregarVeiculosCliente() {
    const clienteId = document.getElementById('venda-cliente').value;
    const select = document.getElementById('venda-veiculo');
    select.innerHTML = '<option value="">Seleccione un vehículo</option>';
    
    if (!clienteId) return;
    
    // Simular carga de vehículos del cliente
    const veiculosMock = [
        { id: 1, placa: 'ABC123', modelo: 'Civic 2020' },
        { id: 2, placa: 'DEF456', modelo: 'Corolla 2019' }
    ];
    
    veiculosMock.forEach(veiculo => {
        const option = document.createElement('option');
        option.value = veiculo.id;
        option.textContent = `${veiculo.placa} - ${veiculo.modelo}`;
        select.appendChild(option);
    });
}

function carregarItensDisponiveis() {
    const tipo = document.getElementById('item-tipo').value;
    const select = document.getElementById('item-disponivel');
    select.innerHTML = '<option value="">Seleccione un elemento</option>';
    
    if (!tipo) return;
    
    let itensMock = [];
    
    if (tipo === 'produto') {
        itensMock = [
            { id: 1, nome: 'Aceite Motor 5W30', preco: 35.00 },
            { id: 2, nome: 'Filtro de Aire', preco: 25.00 },
            { id: 3, nome: 'Pastilla de Freno', preco: 80.00 }
        ];
    } else if (tipo === 'servico') {
        itensMock = [
            { id: 1, nome: 'Cambio de Aceite', preco: 50.00 },
            { id: 2, nome: 'Alineación', preco: 80.00 },
            { id: 3, nome: 'Balanceo', preco: 60.00 }
        ];
    }
    
    itensMock.forEach(item => {
        const option = document.createElement('option');
        option.value = JSON.stringify(item);
        option.textContent = `${item.nome} - $ ${item.preco.toFixed(2)}`;
        select.appendChild(option);
    });
}

function adicionarItem() {
    const tipoSelect = document.getElementById('item-tipo');
    const itemSelect = document.getElementById('item-disponivel');
    const quantidadeInput = document.getElementById('item-quantidade');
    
    if (!tipoSelect.value || !itemSelect.value || !quantidadeInput.value) {
        alert('Por favor, complete todos los campos del elemento.');
        return;
    }
    
    const item = JSON.parse(itemSelect.value);
    const quantidade = parseInt(quantidadeInput.value);
    const tipo = tipoSelect.value;
    
    const itemVenda = {
        id: Date.now(),
        tipo: tipo,
        item_id: item.id,
        nome: item.nome,
        quantidade: quantidade,
        valor_unitario: item.preco,
        valor_total: item.preco * quantidade
    };
    
    itensVenda.push(itemVenda);
    atualizarTabelaItens();
    calcularTotais();
    
    // Limpiar campos
    tipoSelect.value = '';
    itemSelect.innerHTML = '<option value="">Seleccione un elemento</option>';
    quantidadeInput.value = 1;
}

function removerItem(id) {
    itensVenda = itensVenda.filter(item => item.id !== id);
    atualizarTabelaItens();
    calcularTotais();
}

function atualizarTabelaItens() {
    const tbody = document.getElementById('itens-venda-body');
    
    if (itensVenda.length === 0) {
        tbody.innerHTML = '<tr class="empty-state"><td colspan="6" class="text-center">Ningún elemento agregado</td></tr>';
        return;
    }
    
    tbody.innerHTML = itensVenda.map(item => `
        <tr>
            <td>${item.nome}</td>
            <td><span class="badge badge-${item.tipo === 'produto' ? 'primary' : 'success'}">${item.tipo}</span></td>
            <td>${item.quantidade}</td>
            <td>$ ${item.valor_unitario.toFixed(2)}</td>
            <td>$ ${item.valor_total.toFixed(2)}</td>
            <td>
                <button type="button" class="btn btn-sm btn-danger" onclick="removerItem(${item.id})">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

function calcularTotais() {
    const subtotal = itensVenda.reduce((total, item) => total + item.valor_total, 0);
    const desconto = parseFloat(document.getElementById('venda-desconto').value) || 0;
    const valorDesconto = (subtotal * desconto) / 100;
    const total = subtotal - valorDesconto;
    
    document.getElementById('venda-subtotal').textContent = `$ ${subtotal.toFixed(2)}`;
    document.getElementById('venda-valor-desconto').textContent = `$ ${valorDesconto.toFixed(2)}`;
    document.getElementById('venda-total').textContent = `$ ${total.toFixed(2)}`;
}

function salvarVenda(event) {
    event.preventDefault();
    
    if (itensVenda.length === 0) {
        alert('Agregue al menos un elemento a la venta.');
        return;
    }
    
    const formData = new FormData(event.target);
    const venda = Object.fromEntries(formData.entries());
    
    venda.itens = itensVenda;
    venda.subtotal = itensVenda.reduce((total, item) => total + item.valor_total, 0);
    venda.valor_desconto = (venda.subtotal * (parseFloat(venda.desconto) || 0)) / 100;
    venda.total = venda.subtotal - venda.valor_desconto;
    venda.data_venda = new Date().toISOString();
    
    console.log('Guardando venta:', venda);
    
    // Aquí implementaría la llamada para la API
    fecharModalVenda();
    
    // Recargar la tabla de ventas
    if (typeof carregarVendas === 'function') {
        carregarVendas();
    }
    
    alert('Venta guardada con éxito!');
}

// Mostrar/ocultar campos de cuotas
document.getElementById('venda-forma-pagamento').addEventListener('change', function() {
    const parcelasContainer = document.getElementById('parcelas-container');
    if (this.value === 'prazo' || this.value === 'cartao_credito') {
        parcelasContainer.style.display = 'flex';
    } else {
        parcelasContainer.style.display = 'none';
    }
});

// Cerrar modal al hacer clic fuera de él
document.addEventListener('click', function(event) {
    const modal = document.getElementById('venda-modal');
    if (event.target === modal) {
        fecharModalVenda();
    }
});
</script>
