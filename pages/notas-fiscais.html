<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestão de Notas Fiscais - Sistema de Gestão para Oficina Mecânica">
    <title>Notas Fiscais - Sistema de Gestão Oficina</title>
    
    <!-- Design System CSS -->
    <link rel="stylesheet" href="../assets/css/design-system.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-wrench"></i>
                    <h1>Sistema de Gestão - Oficina Mecânica</h1>
                </div>
                <div class="user-info">
                    <span id="currentDate"></span>
                    <div class="user-menu">
                        <i class="fas fa-user-circle"></i>
                        <span>Administrador</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="nav-menu">
        <div class="container">
            <div class="nav-links">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-tachometer-alt"></i>
                    Dashboard
                </a>
                <a href="clientes.html" class="nav-link">
                    <i class="fas fa-users"></i>
                    Clientes
                </a>
                <a href="veiculos.html" class="nav-link">
                    <i class="fas fa-car"></i>
                    Veículos
                </a>
                <a href="servicos.html" class="nav-link">
                    <i class="fas fa-clipboard-list"></i>
                    Ordens de Serviço
                </a>
                <a href="estoque.html" class="nav-link">
                    <i class="fas fa-boxes"></i>
                    Estoque
                </a>
                <a href="notas-fiscais.html" class="nav-link active">
                    <i class="fas fa-file-invoice"></i>
                    Notas Fiscais
                </a>
                <a href="vendas.html" class="nav-link">
                    <i class="fas fa-cash-register"></i>
                    Vendas & Pagamentos
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Conteúdo da página -->
            <div class="page-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                    <h1 class="page-title">Gerenciamento de Notas Fiscais</h1>
                </div>
                <button class="btn btn-primary" id="btn-nova-nota">Nova Nota Fiscal</button>
            </div>

            <!-- Filtros e busca -->
            <div class="card">
                <div class="card-body">
                    <div class="filter-container">
                        <div class="search-box">
                            <input type="text" id="search-nota" placeholder="Buscar nota fiscal...">
                            <button>Buscar</button>
                        </div>
                        <div class="filter-options">
                            <div class="date-range">
                                <label for="data-inicio">De:</label>
                                <input type="date" id="data-inicio">
                                <label for="data-fim">Até:</label>
                                <input type="date" id="data-fim">
                            </div>
                            <select id="filter-status">
                                <option value="">Todos os status</option>
                                <option value="emitida">Emitida</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabela de notas fiscais -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Notas Fiscais</h2>
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Número</th>
                                <th>Data Emissão</th>
                                <th>Cliente</th>
                                <th>Valor Total</th>
                                <th>Status</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="notas-table-body">
                            <!-- Dados serão carregados via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-container"></div>

    <!-- Modal de Nota Fiscal -->
    <div id="nota-fiscal-modal-container"></div>

    <!-- Scripts -->
    <script src="../assets/js/app.js"></script>
    <script>
        // Carregar componentes
        document.addEventListener('DOMContentLoaded', function() {
            // Carregar sidebar
            fetch('../components/sidebar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sidebar-container').innerHTML = data;
                });
            
            // Carregar header
            fetch('../components/header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header-container').innerHTML = data;
                });
            
            // Carregar modal de nota fiscal
            fetch('../components/modals/nota-fiscal-modal.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('nota-fiscal-modal-container').innerHTML = data;
                    
                    // Configurar botão Nova Nota Fiscal após carregar o modal
                    setTimeout(() => {
                        const btnNovaNota = document.getElementById('btn-nova-nota');
                        if (btnNovaNota) {
                            btnNovaNota.addEventListener('click', function() {
                                if (typeof abrirModalNotaFiscal === 'function') {
                                    abrirModalNotaFiscal();
                                } else {
                                    console.error('Função abrirModalNotaFiscal não encontrada');
                                }
                            });
                        }
                    }, 100);
                });
            
            // Carregar footer
            fetch('../components/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                });
        });
    </script>
        </div>
    </main>
</body>
</html>
