<!-- Tabela de Clientes -->
<div class="table-container">
    <div class="table-header">
        <h3>Lista de Clientes</h3>
        <div class="table-actions">
            <button class="btn btn-primary" id="btn-novo-cliente">
                <i class="fas fa-plus"></i> Novo Cliente
            </button>
            <button class="btn btn-secondary" id="btn-exportar-clientes">
                <i class="fas fa-download"></i> Exportar
            </button>
        </div>
    </div>
    
    <div class="table-filters">
        <div class="filter-group">
            <input type="text" placeholder="Buscar cliente..." id="search-cliente" class="search-input">
            <select id="filter-status" class="filter-select">
                <option value="">Todos os Status</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table class="data-table" id="clientes-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF/CNPJ</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Cidade</th>
                    <th>Status</th>
                    <th>Cadastro</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Dados serão carregados via JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="table-pagination">
        <div class="pagination-info">
            <span>Mostrando <span id="showing-start">1</span> a <span id="showing-end">10</span> de <span id="total-records">0</span> registros</span>
        </div>
        <div class="pagination-controls">
            <button class="btn-pagination" id="btn-prev" disabled>
                <i class="fas fa-chevron-left"></i>
            </button>
            <span class="pagination-numbers" id="pagination-numbers">
                <!-- Números das páginas serão gerados via JavaScript -->
            </span>
            <button class="btn-pagination" id="btn-next">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>
