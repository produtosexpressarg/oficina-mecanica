<!-- Modal Novo Cliente -->
<div class="modal fade" id="clienteModal" tabindex="-1" aria-labelledby="clienteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="clienteModalLabel">Novo Cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="clienteForm">
                    <!-- Informações Básicas -->
                    <div class="row">
                        <div class="col-md-8">
                            <div class="form-group">
                                <label for="nomeCliente" class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" id="nomeCliente" name="nome" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="tipoCliente" class="form-label">Tipo *</label>
                                <select class="form-select" id="tipoCliente" name="tipo" required onchange="toggleDocumento()">
                                    <option value="">Selecione</option>
                                    <option value="pessoa_fisica">Pessoa Física</option>
                                    <option value="pessoa_juridica">Pessoa Jurídica</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Documentos -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group" id="cpf-group">
                                <label for="cpfCliente" class="form-label">CPF *</label>
                                <input type="text" class="form-control" id="cpfCliente" name="cpf" placeholder="000.000.000-00">
                            </div>
                            <div class="form-group" id="cnpj-group" style="display: none;">
                                <label for="cnpjCliente" class="form-label">CNPJ *</label>
                                <input type="text" class="form-control" id="cnpjCliente" name="cnpj" placeholder="00.000.000/0000-00">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group" id="rg-group">
                                <label for="rgCliente" class="form-label">RG</label>
                                <input type="text" class="form-control" id="rgCliente" name="rg">
                            </div>
                            <div class="form-group" id="ie-group" style="display: none;">
                                <label for="ieCliente" class="form-label">Inscrição Estadual</label>
                                <input type="text" class="form-control" id="ieCliente" name="inscricao_estadual">
                            </div>
                        </div>
                    </div>

                    <!-- Contato -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="telefoneCliente" class="form-label">Telefone *</label>
                                <input type="tel" class="form-control" id="telefoneCliente" name="telefone" placeholder="(00) 00000-0000" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="emailCliente" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="emailCliente" name="email" placeholder="cliente@email.com">
                            </div>
                        </div>
                    </div>

                    <!-- Endereço -->
                    <h6 class="mt-4 mb-3"><i class="fas fa-map-marker-alt"></i> Endereço</h6>
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="cepCliente" class="form-label">CEP</label>
                                <input type="text" class="form-control" id="cepCliente" name="cep" placeholder="00000-000" onblur="buscarCEP()">
                            </div>
                        </div>
                        <div class="col-md-7">
                            <div class="form-group">
                                <label for="enderecoCliente" class="form-label">Endereço</label>
                                <input type="text" class="form-control" id="enderecoCliente" name="endereco">
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group">
                                <label for="numeroCliente" class="form-label">Número</label>
                                <input type="text" class="form-control" id="numeroCliente" name="numero">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="complementoCliente" class="form-label">Complemento</label>
                                <input type="text" class="form-control" id="complementoCliente" name="complemento">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="bairroCliente" class="form-label">Bairro</label>
                                <input type="text" class="form-control" id="bairroCliente" name="bairro">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="cidadeCliente" class="form-label">Cidade</label>
                                <input type="text" class="form-control" id="cidadeCliente" name="cidade">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="estadoCliente" class="form-label">Estado</label>
                                <select class="form-select" id="estadoCliente" name="estado">
                                    <option value="">Selecione</option>
                                    <option value="AC">Acre</option>
                                    <option value="AL">Alagoas</option>
                                    <option value="AP">Amapá</option>
                                    <option value="AM">Amazonas</option>
                                    <option value="BA">Bahia</option>
                                    <option value="CE">Ceará</option>
                                    <option value="DF">Distrito Federal</option>
                                    <option value="ES">Espírito Santo</option>
                                    <option value="GO">Goiás</option>
                                    <option value="MA">Maranhão</option>
                                    <option value="MT">Mato Grosso</option>
                                    <option value="MS">Mato Grosso do Sul</option>
                                    <option value="MG">Minas Gerais</option>
                                    <option value="PA">Pará</option>
                                    <option value="PB">Paraíba</option>
                                    <option value="PR">Paraná</option>
                                    <option value="PE">Pernambuco</option>
                                    <option value="PI">Piauí</option>
                                    <option value="RJ">Rio de Janeiro</option>
                                    <option value="RN">Rio Grande do Norte</option>
                                    <option value="RS">Rio Grande do Sul</option>
                                    <option value="RO">Rondônia</option>
                                    <option value="RR">Roraima</option>
                                    <option value="SC">Santa Catarina</option>
                                    <option value="SP">São Paulo</option>
                                    <option value="SE">Sergipe</option>
                                    <option value="TO">Tocantins</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="statusCliente" class="form-label">Status</label>
                                <select class="form-select" id="statusCliente" name="status">
                                    <option value="ativo">Ativo</option>
                                    <option value="inativo">Inativo</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Observações -->
                    <div class="form-group">
                        <label for="observacoesCliente" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacoesCliente" name="observacoes" rows="3" placeholder="Observações adicionais sobre o cliente..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    <i class="fas fa-times"></i> Cancelar
                </button>
                <button type="button" class="btn btn-primary" id="salvarCliente">
                    <i class="fas fa-save"></i> Salvar Cliente
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function toggleDocumento() {
    const tipo = document.getElementById('tipoCliente').value;
    const cpfGroup = document.getElementById('cpf-group');
    const cnpjGroup = document.getElementById('cnpj-group');
    const rgGroup = document.getElementById('rg-group');
    const ieGroup = document.getElementById('ie-group');

    if (tipo === 'pessoa_fisica') {
        cpfGroup.style.display = 'block';
        cnpjGroup.style.display = 'none';
        rgGroup.style.display = 'block';
        ieGroup.style.display = 'none';
        
        document.getElementById('cpfCliente').required = true;
        document.getElementById('cnpjCliente').required = false;
    } else if (tipo === 'pessoa_juridica') {
        cpfGroup.style.display = 'none';
        cnpjGroup.style.display = 'block';
        rgGroup.style.display = 'none';
        ieGroup.style.display = 'block';
        
        document.getElementById('cpfCliente').required = false;
        document.getElementById('cnpjCliente').required = true;
    } else {
        cpfGroup.style.display = 'block';
        cnpjGroup.style.display = 'none';
        rgGroup.style.display = 'block';
        ieGroup.style.display = 'none';
    }
}

function buscarCEP() {
    const cep = document.getElementById('cepCliente').value.replace(/\D/g, '');
    
    if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(response => response.json())
            .then(data => {
                if (!data.erro) {
                    document.getElementById('enderecoCliente').value = data.logradouro;
                    document.getElementById('bairroCliente').value = data.bairro;
                    document.getElementById('cidadeCliente').value = data.localidade;
                    document.getElementById('estadoCliente').value = data.uf;
                }
            })
            .catch(error => console.log('Erro ao buscar CEP:', error));
    }
}

// Máscaras para os campos
document.addEventListener('DOMContentLoaded', function() {
    // Máscara CPF
    document.getElementById('cpfCliente').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        e.target.value = value;
    });

    // Máscara CNPJ
    document.getElementById('cnpjCliente').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/(\d{2})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d)/, '$1/$2');
        value = value.replace(/(\d{4})(\d{1,2})$/, '$1-$2');
        e.target.value = value;
    });

    // Máscara Telefone
    document.getElementById('telefoneCliente').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/(\d{2})(\d)/, '($1) $2');
        value = value.replace(/(\d{5})(\d{1,4})$/, '$1-$2');
        e.target.value = value;
    });

    // Máscara CEP
    document.getElementById('cepCliente').addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        value = value.replace(/(\d{5})(\d{1,3})$/, '$1-$2');
        e.target.value = value;
    });
});
</script>
