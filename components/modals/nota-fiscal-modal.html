<!-- Modal de Comprobante -->
<div id="nota-fiscal-modal" class="modal">
    <div class="modal-content modal-xl">
        <div class="modal-header">
            <h3 class="modal-title" id="nota-fiscal-modal-title">Nuevo Comprobante</h3>
            <button type="button" class="modal-close" onclick="fecharModalNotaFiscal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="nota-fiscal-form" method="post" action="" onsubmit="return salvarNotaFiscal(event)">
                <input type="hidden" id="nota-fiscal-id" name="id">
                
                <!-- Informaciones de la Empresa -->
                <div class="form-section">
                    <h4><i class="fas fa-building"></i> Datos de la Empresa (Emisor)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empresa-razao-social">Razón Social *</label>
                            <input type="text" id="empresa-razao-social" name="empresa_razao_social" class="form-control" required value="Taller Mecánico SRL">
                        </div>
                        <div class="form-group">
                            <label for="empresa-cnpj" class="required">CUIT</label>
                            <input type="text" id="empresa-cnpj" name="empresa_cnpj" class="form-control" required value="30-12345678-9" data-mask="cnpj" data-validate="cnpj">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="empresa-endereco">Dirección *</label>
                            <input type="text" id="empresa-endereco" name="empresa_endereco" class="form-control" required value="Av. Talleres, 123">
                        </div>
                        <div class="form-group">
                            <label for="empresa-cidade">Ciudad *</label>
                            <input type="text" id="empresa-cidade" name="empresa_cidade" class="form-control" required value="Buenos Aires">
                        </div>
                        <div class="form-group">
                            <label for="empresa-uf">Provincia *</label>
                            <select id="empresa-uf" name="empresa_uf" class="form-control" required>
                                <option value="CABA" selected>CABA</option>
                                <option value="Buenos Aires">Buenos Aires</option>
                                <option value="Córdoba">Córdoba</option>
                                <option value="Santa Fe">Santa Fe</option>
                                <option value="Mendoza">Mendoza</option>
                                <option value="Tucumán">Tucumán</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Informaciones del Cliente -->
                <div class="form-section">
                    <h4><i class="fas fa-user"></i> Datos del Cliente (Destinatario)</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-select">Cliente *</label>
                            <select id="cliente-select" name="cliente_id" class="form-control" required onchange="carregarDadosCliente()">
                                <option value="">Seleccione un cliente</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="cliente-tipo-documento">Tipo de Documento</label>
                            <select id="cliente-tipo-documento" name="cliente_tipo_documento" class="form-control">
                                <option value="cpf">CUIL/DNI</option>
                                <option value="cnpj">CUIT</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-nome">Nombre/Razón Social *</label>
                            <input type="text" id="cliente-nome" name="cliente_nome" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="cliente-documento">CUIL/CUIT *</label>
                            <input type="text" id="cliente-documento" name="cliente_documento" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-endereco">Dirección</label>
                            <input type="text" id="cliente-endereco" name="cliente_endereco" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="cliente-cidade">Ciudad</label>
                            <input type="text" id="cliente-cidade" name="cliente_cidade" class="form-control">
                        </div>
                    </div>
                </div>

                <!-- Informaciones del Comprobante -->
                <div class="form-section">
                    <h4><i class="fas fa-file-invoice"></i> Datos del Comprobante</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nf-numero">Número de Factura *</label>
                            <input type="text" id="nf-numero" name="numero" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="nf-serie">Serie *</label>
                            <input type="text" id="nf-serie" name="serie" class="form-control" required value="1">
                        </div>
                        <div class="form-group">
                            <label for="nf-data-emissao">Fecha de Emisión *</label>
                            <input type="datetime-local" id="nf-data-emissao" name="data_emissao" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="nf-natureza-operacao">Naturaleza de la Operación *</label>
                            <select id="nf-natureza-operacao" name="natureza_operacao" class="form-control" required>
                                <option value="">Seleccione</option>
                                <option value="venda">Venta de Mercadería</option>
                                <option value="prestacao_servico">Prestación de Servicio</option>
                                <option value="venda_servico">Venta de Mercadería y Prestación de Servicio</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="nf-tipo-documento">Tipo de Documento *</label>
                            <select id="nf-tipo-documento" name="tipo_documento" class="form-control" required>
                                <option value="55">55 - Factura A</option>
                                <option value="65">65 - Factura B</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Ítems del Comprobante -->
                <div class="form-section">
                    <h4><i class="fas fa-list"></i> Ítems del Comprobante</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="item-tipo">Tipo de Elemento</label>
                            <select id="item-tipo" class="form-control">
                                <option value="">Seleccione el tipo</option>
                                <option value="produto">Producto</option>
                                <option value="servico">Servicio</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="item-codigo">Elemento</label>
                            <select id="item-codigo" class="form-control">
                                <option value="">Seleccione un elemento</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="item-quantidade-nf">Cantidad</label>
                            <input type="number" id="item-quantidade-nf" class="form-control" min="1" step="0.01" value="1">
                        </div>
                        <div class="form-group">
                            <button type="button" class="btn btn-success" id="btn-adicionar-item">
                                <i class="fas fa-plus"></i> Agregar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Tabla de Ítems -->
                <div class="form-section">
                    <div class="table-responsive">
                        <table class="table" id="itens-nf-table">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Descripción</th>
                                    <th>NCM</th>
                                    <th>CFOP</th>
                                    <th>Unidad</th>
                                    <th>Cant</th>
                                    <th>Valor Unit.</th>
                                    <th>Total</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="itens-nf-body">
                                <tr class="empty-state">
                                    <td colspan="9" class="text-center">Ningún elemento agregado</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Totales del Comprobante -->
                <div class="form-section">
                    <div class="nf-totals-container">
                        <div class="totals-grid">
                            <div class="total-item">
                                <label>Base de Cálculo IVA:</label>
                                <span id="nf-base-icms">$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor IVA:</label>
                                <span id="nf-valor-icms">$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Base de Cálculo IVA ST:</label>
                                <span id="nf-base-icms-st">$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor IVA ST:</label>
                                <span id="nf-valor-icms-st">$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor Total de Productos:</label>
                                <span id="nf-total-produtos">$ 0,00</span>
                            </div>
                            <div class="total-item">
                                <label>Valor del Flete:</label>
                                <input type="number" id="nf-frete" name="valor_frete" class="form-control" step="0.01" value="0" onchange="calcularTotaisNF()">
                            </div>
                            <div class="total-item">
                                <label>Valor del Seguro:</label>
                                <input type="number" id="nf-seguro" name="valor_seguro" class="form-control" step="0.01" value="0" onchange="calcularTotaisNF()">
                            </div>
                            <div class="total-item">
                                <label>Otras Gastos:</label>
                                <input type="number" id="nf-outras-despesas" name="outras_despesas" class="form-control" step="0.01" value="0" onchange="calcularTotaisNF()">
                            </div>
                            <div class="total-item total-final">
                                <label>Valor Total del Comprobante:</label>
                                <span id="nf-total-geral">$ 0,00</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Informaciones Adicionales -->
                <div class="form-section">
                    <h4><i class="fas fa-info-circle"></i> Informaciones Adicionales</h4>
                    <div class="form-group">
                        <label for="nf-observacoes">Observaciones</label>
                        <textarea id="nf-observacoes" name="observacoes" class="form-control" rows="3" placeholder="Informaciones complementarias del comprobante..."></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="fecharModalNotaFiscal()">
                <i class="fas fa-times"></i> Cancelar
            </button>
            <button type="button" class="btn btn-warning" onclick="visualizarNotaFiscal()">
                <i class="fas fa-eye"></i> Visualizar
            </button>
            <button type="submit" form="nota-fiscal-form" class="btn btn-primary">
                <i class="fas fa-save"></i> Emitir Comprobante
            </button>
        </div>
    </div>
</div>

<script>
let itensNotaFiscal = [];
let numeroNotaFiscal = 1;

function abrirModalNotaFiscal(id = null) {
    const modal = document.getElementById('nota-fiscal-modal');
    const title = document.getElementById('nota-fiscal-modal-title');
    
    if (!modal) {
        console.error('Modal de comprobante no encontrado');
        return;
    }
    
    if (title) {
        if (id) {
            title.textContent = 'Editar Comprobante';
            carregarDadosNotaFiscal(id);
        } else {
            title.textContent = 'Nuevo Comprobante';
            const form = document.getElementById('nota-fiscal-form');
            if (form) {
                form.reset();
            }
            itensNotaFiscal = [];
            gerarNumeroNotaFiscal();
            definirDataEmissaoAtual();
            atualizarTabelaItensNF();
            calcularTotaisNF();
        }
    }
    
    carregarClientesNF();
    modal.style.display = 'block';
    modal.classList.add('show');
}

function fecharModalNotaFiscal() {
    const modal = document.getElementById('nota-fiscal-modal');
    if (modal) {
        modal.style.display = 'none';
        modal.classList.remove('show');
    }
    
    const form = document.getElementById('nota-fiscal-form');
    if (form) {
        form.reset();
    }
    
    itensNotaFiscal = [];
    
    // Limpiar tabla de elementos
    const tbody = document.getElementById('itens-nf-body');
    if (tbody) {
        tbody.innerHTML = '<tr class="empty-state"><td colspan="9" class="text-center">Ningún elemento agregado</td></tr>';
    }
    
    // Resetear totales
    calcularTotaisNF();
}

function gerarNumeroNotaFiscal() {
    // Simular generación de número secuencial
    const numeroAtual = localStorage.getItem('ultimoNumeroNF') || '0';
    numeroNotaFiscal = parseInt(numeroAtual) + 1;
    const numeroInput = document.getElementById('nf-numero');
    if (numeroInput) {
        numeroInput.value = numeroNotaFiscal.toString().padStart(9, '0');
    }
}

function definirDataEmissaoAtual() {
    const agora = new Date();
    const dataFormatada = agora.toISOString().slice(0, 16);
    const dataInput = document.getElementById('nf-data-emissao');
    if (dataInput) {
        dataInput.value = dataFormatada;
    }
}

function carregarClientesNF() {
    const select = document.getElementById('cliente-select');
    select.innerHTML = '<option value="">Seleccione un cliente</option>';
    
    // Simular carga de clientes
    const clientesMock = [
        { 
            id: 1, 
            nome: 'Juan Pérez', 
            cpf: '20-12345678-9',
            endereco: 'Calle A, 123',
            cidade: 'Buenos Aires'
        },
        { 
            id: 2, 
            nome: 'María Gómez SRL', 
            cnpj: '30-87654321-0',
            endereco: 'Av. B, 456',
            cidade: 'Córdoba'
        }
    ];
    
    clientesMock.forEach(cliente => {
        const option = document.createElement('option');
        option.value = JSON.stringify(cliente);
        option.textContent = cliente.nome;
        select.appendChild(option);
    });
}

function carregarDadosCliente() {
    const clienteSelect = document.getElementById('cliente-select');
    if (!clienteSelect.value) return;
    
    const cliente = JSON.parse(clienteSelect.value);
    
    document.getElementById('cliente-nome').value = cliente.nome;
    document.getElementById('cliente-endereco').value = cliente.endereco || '';
    document.getElementById('cliente-cidade').value = cliente.cidade || '';
    
    if (cliente.cpf) {
        document.getElementById('cliente-tipo-documento').value = 'cpf';
        document.getElementById('cliente-documento').value = cliente.cpf;
    } else if (cliente.cnpj) {
        document.getElementById('cliente-tipo-documento').value = 'cnpj';
        document.getElementById('cliente-documento').value = cliente.cnpj;
    }
}

function carregarItensNF() {
    const tipo = document.getElementById('item-tipo').value;
    const select = document.getElementById('item-codigo');
    select.innerHTML = '<option value="">Seleccione un elemento</option>';
    
    if (!tipo) return;
    
    let itensMock = [];
    
    if (tipo === 'produto') {
        itensMock = [
            { 
                id: 1, 
                codigo: 'PROD001',
                nome: 'Aceite Motor 5W30', 
                preco: 35.00,
                ncm: '27101932',
                cfop: '5102',
                unidade: 'LT'
            },
            { 
                id: 2, 
                codigo: 'PROD002',
                nome: 'Filtro de Aire', 
                preco: 25.00,
                ncm: '84213100',
                cfop: '5102',
                unidade: 'UN'
            }
        ];
    } else if (tipo === 'servico') {
        itensMock = [
            { 
                id: 1, 
                codigo: 'SERV001',
                nome: 'Cambio de Aceite', 
                preco: 50.00,
                ncm: '00000000',
                cfop: '5933',
                unidade: 'UN'
            },
            { 
                id: 2, 
                codigo: 'SERV002',
                nome: 'Alineación', 
                preco: 80.00,
                ncm: '00000000',
                cfop: '5933',
                unidade: 'UN'
            }
        ];
    }
    
    itensMock.forEach(item => {
        const option = document.createElement('option');
        option.value = JSON.stringify(item);
        option.textContent = `${item.codigo} - ${item.nome}`;
        select.appendChild(option);
    });
}

function adicionarItemNF() {
    const itemSelect = document.getElementById('item-codigo');
    const quantidadeInput = document.getElementById('item-quantidade-nf');
    
    if (!itemSelect.value || !quantidadeInput.value) {
        alert('Por favor, seleccione un elemento y indique la cantidad.');
        return;
    }
    
    const item = JSON.parse(itemSelect.value);
    const quantidade = parseFloat(quantidadeInput.value);
    
    const itemNF = {
        id: Date.now(),
        codigo: item.codigo,
        descricao: item.nome,
        ncm: item.ncm,
        cfop: item.cfop,
        unidade: item.unidade,
        quantidade: quantidade,
        valor_unitario: item.preco,
        valor_total: item.preco * quantidade
    };
    
    itensNotaFiscal.push(itemNF);
    atualizarTabelaItensNF();
    calcularTotaisNF();
    
    // Limpiar campos
    document.getElementById('item-tipo').value = '';
    document.getElementById('item-codigo').innerHTML = '<option value="">Seleccione un elemento</option>';
    document.getElementById('item-quantidade-nf').value = 1;
}

function removerItemNF(id) {
    itensNotaFiscal = itensNotaFiscal.filter(item => item.id !== id);
    atualizarTabelaItensNF();
    calcularTotaisNF();
}

function atualizarTabelaItensNF() {
    const tbody = document.getElementById('itens-nf-body');
    
    if (!tbody) {
        console.error('Tabla de elementos no encontrada');
        return;
    }
    
    if (itensNotaFiscal.length === 0) {
        tbody.innerHTML = '<tr class="empty-state"><td colspan="9" class="text-center">Ningún elemento agregado</td></tr>';
        return;
    }
    
    tbody.innerHTML = itensNotaFiscal.map(item => `
        <tr>
            <td>${item.codigo}</td>
            <td>${item.descricao}</td>
            <td>${item.ncm}</td>
            <td>${item.cfop}</td>
            <td>${item.unidade}</td>
            <td>${item.quantidade}</td>
            <td>$ ${item.valor_unitario.toFixed(2)}</td>
            <td>$ ${item.valor_total.toFixed(2)}</td>
            <td>
                <button type="button" class="btn btn-sm btn-danger" onclick="removerItemNF(${item.id})">
                    <i class="fas fa-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

function calcularTotaisNF() {
    const totalProdutos = itensNotaFiscal.reduce((total, item) => total + item.valor_total, 0);
    
    const freteInput = document.getElementById('nf-frete');
    const seguroInput = document.getElementById('nf-seguro');
    const outrasInput = document.getElementById('nf-outras-despesas');
    
    const frete = freteInput ? (parseFloat(freteInput.value) || 0) : 0;
    const seguro = seguroInput ? (parseFloat(seguroInput.value) || 0) : 0;
    const outrasDespesas = outrasInput ? (parseFloat(outrasInput.value) || 0) : 0;
    
    const totalGeral = totalProdutos + frete + seguro + outrasDespesas;
    
    // Cálculo simplificado de impuestos (21% de IVA)
    const baseICMS = totalProdutos;
    const valorICMS = baseICMS * 0.21;
    
    // Actualizar elementos con verificación de existencia
    const totalProdutosEl = document.getElementById('nf-total-produtos');
    if (totalProdutosEl) totalProdutosEl.textContent = `$ ${totalProdutos.toFixed(2)}`;
    
    const baseICMSEl = document.getElementById('nf-base-icms');
    if (baseICMSEl) baseICMSEl.textContent = `$ ${baseICMS.toFixed(2)}`;
    
    const valorICMSEl = document.getElementById('nf-valor-icms');
    if (valorICMSEl) valorICMSEl.textContent = `$ ${valorICMS.toFixed(2)}`;
    
    const baseICMSSTEl = document.getElementById('nf-base-icms-st');
    if (baseICMSSTEl) baseICMSSTEl.textContent = '$ 0,00';
    
    const valorICMSSTEl = document.getElementById('nf-valor-icms-st');
    if (valorICMSSTEl) valorICMSSTEl.textContent = '$ 0,00';
    
    const totalGeralEl = document.getElementById('nf-total-geral');
    if (totalGeralEl) totalGeralEl.textContent = `$ ${totalGeral.toFixed(2)}`;
}

function visualizarNotaFiscal() {
    if (itensNotaFiscal.length === 0) {
        alert('Agregue al menos un elemento al comprobante.');
        return;
    }
    
    // Implementar visualización del comprobante
    alert('Funcionalidad de visualización será implementada pronto.');
}

function salvarNotaFiscal(event) {
    event.preventDefault();
    
    if (itensNotaFiscal.length === 0) {
        alert('Agregue al menos un elemento al comprobante.');
        return false;
    }
    
    const formData = new FormData(event.target);
    const notaFiscal = Object.fromEntries(formData.entries());
    
    notaFiscal.itens = itensNotaFiscal;
    notaFiscal.total_produtos = itensNotaFiscal.reduce((total, item) => total + item.valor_total, 0);
    notaFiscal.total_geral = notaFiscal.total_produtos + 
                            (parseFloat(notaFiscal.valor_frete) || 0) + 
                            (parseFloat(notaFiscal.valor_seguro) || 0) + 
                            (parseFloat(notaFiscal.outras_despesas) || 0);
    
    console.log('Emitiendo comprobante:', notaFiscal);
    
    // Guardar en localStorage
    const notasFiscais = JSON.parse(localStorage.getItem('notasFiscais') || '[]');
    notasFiscais.push(notaFiscal);
    localStorage.setItem('notasFiscais', JSON.stringify(notasFiscais));
    
    // Guardar último número usado
    localStorage.setItem('ultimoNumeroNF', numeroNotaFiscal.toString());
    
    // Aquí implementaría la llamada para la API de AFIP
    fecharModalNotaFiscal();
    
    // Recargar la tabla de comprobantes
    if (typeof carregarNotasFiscais === 'function') {
        carregarNotasFiscais();
    }
    
    alert('Comprobante emitido con éxito!');
    return false;
}

// Cerrar modal al hacer clic fuera de él
document.addEventListener('click', function(event) {
    const modal = document.getElementById('nota-fiscal-modal');
    if (modal && event.target === modal) {
        fecharModalNotaFiscal();
    }
});

// Cerrar modal con tecla ESC
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        const modal = document.getElementById('nota-fiscal-modal');
        if (modal && modal.style.display === 'block') {
            fecharModalNotaFiscal();
        }
    }
});
</script>

<style>
.modal-xl {
    max-width: 1200px;
}

.nf-totals-container {
    background: #f8f9fa;
    padding: 1.5rem;
    border-radius: 8px;
    border: 1px solid #dee2e6;
}

.totals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1rem;
}

.total-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem;
    background: white;
    border-radius: 4px;
    border: 1px solid #e9ecef;
}

.total-item label {
    font-weight: 500;
    margin: 0;
}

.total-item input {
    width: 100px;
    text-align: right;
}

.total-final {
